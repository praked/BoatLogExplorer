rgba(color, 0.35),\n                    hovertemplate=\"%{x|%H:%M:%S}<extra></extra>\"), row=row, col=1)\n\n        # Mark the stretches that cleared the jitter threshold.\n        if \"moving\" in fix.columns and fix[\"moving\"].any():\n            for a, b in _true_spans(_times(fix[\"t\"]), fix[\"moving\"].to_numpy()):\n                fig.add_trace(go.Scatter(\n                    x=[native(a), native(b)], y=[-0.22, -0.22], mode=\"lines\",\n                    line=dict(color=\"#0ca30c\", width=6),\n                    hovertemplate=\"moving<extra></extra>\"), row=row, col=1)\n\n        fig.update_yaxes(range=[-0.4, 1.12], showticklabels=False,\n                         showgrid=False, row=row, col=1)\n\n    # Dim everything outside the selection.\n    for row in range(1, len(logs) + 1):\n        if sel0 > t_lo:\n            fig.add_vrect(x0=t_lo, x1=sel0, row=row, col=1, line_width=0,\n                          fillcolor=\"rgba(128,128,128,0.40)\", layer=\"above\")\n        if sel1 < t_hi:\n            fig.add_vrect(x0=sel1, x1=t_hi, row=row, col=1, line_width=0,\n                          fillcolor=\"rgba(128,128,128,0.40)\", layer=\"above\")\n        for edge in (sel0, sel1):\n            fig.add_vline(x=edge, row=row, col=1,\n                          line=dict(color=\"#d03b3b\", width=2))\n\n    fig.update_xaxes(range=[t_lo, t_hi])\n    fig = _layout(fig, max(120, height_per * len(logs) + 46))\n\n    # Lane labels as horizontal annotations. A y-axis title would be rotated\n    # vertically, and with several short lanes those collide with each other.\n    for row, lg in enumerate(logs, start=1):\n        axis = fig.layout[f\"yaxis{row}\" if row > 1 else \"yaxis\"]\n        lo, hi = axis.domain\n        fig.add_annotation(\n            xref=\"paper\", yref=\"paper\", x=-0.008, y=(lo + hi) / 2,\n            xanchor=\"right\", yanchor=\"middle\", showarrow=False,\n            text=lg.id.replace(\"boat_log_\", \"\"),\n            font=dict(size=10, color=MUTED))\n\n    fig.update_layout(hovermode=\"closest\", margin=dict(l=132, r=16, t=8, b=28))\n    return fig\n\n\ndef _true_spans(t, flag):\n    \"\"\"Contiguous [start, end] ranges where a boolean series is true.\"\"\"\n    flag = np.asarray(flag, dtype=bool)\n    if not flag.any():\n        return []\n    edges = np.diff(flag.astype(np.int8))\n    starts = list(np.flatnonzero(edges == 1) + 1)\n    ends = list(np.flatnonzero(edges == -1))\n    if flag[0]:\n        starts.insert(0, 0)\n    if flag[-1]:\n        ends.append(len(flag) - 1)\n    return [(t[a], t[b]) for a, b in zip(starts, ends) if b > a]\n\n\ndef aliveness_strip(qa, t0, t1, keys):\n    \"\"\"Timeline ribbon showing when each channel carried real signal.\"\"\"\n    rows = [(k, qa.channel(k)) for k in keys if qa.channel(k) is not None]\n    if not rows:\n        return None\n\n    status_color = {\"ALIVE\": \"#0ca30c\", \"PARTIAL\": \"#fab219\",\n                    \"FROZEN\": \"#ec835a\", \"CONSTANT\": \"#d03b3b\", \"ABSENT\": \"#d5d3cc\"}\n\n    fig = go.Figure()\n    labels = []\n    for i, (key, rep) in enumerate(rows):\n        labels.append(CHANNELS_BY_KEY[key].label if key in CHANNELS_BY_KEY else key)\n        fig.add_trace(go.Scatter(\n            x=[t0, t1], y=[i, i], mode=\"lines\", hoverinfo=\"skip\",\n            line=dict(color=\"rgba(128,128,128,0.25)\", width=14)))\n        spans = rep.alive_windows or ([(t0, t1)] if rep.verdict == \"ALIVE\" else [])\n        for a, b in spans:\n            fig.add_trace(go.Scatter(\n                x=[a, b], y=[i, i], mode=\"lines\",\n                line=dict(color=status_color.get(rep.verdict, MUTED), width=14),\n                hovertemplate=f\"{labels[-1]}: {rep.verdict}<extra></extra>\"))\n\n    fig.update_yaxes(tickmode=\"array\", tickvals=list(range(len(rows))),\n                     ticktext=labels, range=[-0.6, len(rows) - 0.4],\n                     showgrid=False)\n    fig.update_xaxes(range=[t0, t1])\n    return _layout(fig, 42 + 30 * len(rows), \"When was each channel alive?\")\n"}, "boatviz\\derive.py": {"data": "\"\"\"Speed, course over ground, and heading residuals.\n\nEverything here runs on deduplicated fixes, never on raw rows: at ~10 Hz logging\nagainst a ~1 Hz receiver, consecutive raw rows are usually the same fix and any\nspeed computed from them is meaningless.\n\"\"\"\n\nimport numpy as np\nimport pandas as pd\n\nfrom .geo import ang_diff, bearing_deg, circ_mean_R, haversine_m, wrap180, wrap360\nfrom .schema import POWER_CHANNELS, SAIL_FAULT_OK\n\nDEFAULT_SPEED_WINDOW_S = 5.0\nDEFAULT_D_MIN_M = 3.0\nDEFAULT_COG_MAX_WINDOW_S = 60.0\nDEFAULT_V_MAX_MS = 8.0\n\n# Below this speed the receiver's own jitter dominates: a stationary boat still\n# wanders several metres per minute, which is enough to satisfy any displacement\n# threshold while carrying no directional information at all. Course over ground\n# is only defined above it.\nDEFAULT_MIN_SPEED_MS = 0.5\n\nCONVENTIONS = {\n    \"COG\": lambda c: c,\n    \"90 - COG\": lambda c: 90.0 - c,\n    \"180 - COG\": lambda c: 180.0 - c,\n    \"-COG\": lambda c: -c,\n    \"COG + 90\": lambda c: c + 90.0,\n    \"COG + 180\": lambda c: c + 180.0,\n}\n\n\ndef _epoch_seconds(series):\n    \"\"\"Seconds since the epoch, without the tz-stripping warning numpy emits\n    when a tz-aware column is cast to datetime64 directly.\"\"\"\n    s = series.dt.tz_convert(\"UTC\").dt.tz_localize(None) \\\n        if isinstance(series.dtype, pd.DatetimeTZDtype) else series\n    return s.to_numpy(dtype=\"datetime64[ms]\").astype(np.float64) / 1000.0\n\n\ndef enrich(log, speed_window_s=DEFAULT_SPEED_WINDOW_S, d_min_m=DEFAULT_D_MIN_M,\n           cog_max_window_s=DEFAULT_COG_MAX_WINDOW_S, v_max_ms=DEFAULT_V_MAX_MS,\n           min_speed_ms=DEFAULT_MIN_SPEED_MS):\n    \"\"\"Add speed, outlier, moving, cog and residual columns to log.fix in place.\"\"\"\n    fix = log.fix\n    if len(fix) < 2:\n        for c in (\"speed\", \"cog\", \"resid\"):\n            fix[c] = np.nan\n        for c in (\"outlier\", \"moving\"):\n            fix[c] = False\n        return log\n\n    lat = fix[\"lat\"].to_numpy()\n    lon = fix[\"lon\"].to_numpy()\n    ts = _epoch_seconds(fix[\"t\"])\n\n    fix[\"outlier\"] = _flag_outliers(lat, lon, ts, v_max_ms)\n    keep = ~fix[\"outlier\"].to_numpy()\n\n    speed = _windowed_speed(lat, lon, ts, keep, speed_window_s)\n    fix[\"speed\"] = speed\n    fix[\"moving\"] = np.nan_to_num(speed, nan=0.0) >= min_speed_ms\n\n    cog = _adaptive_cog(lat, lon, ts, keep, d_min_m, cog_max_window_s)\n    cog[~fix[\"moving\"].to_numpy()] = np.nan\n    fix[\"cog\"] = cog\n    fix[\"resid\"] = wrap180(fix[\"hdg\"].to_numpy(dtype=float) - cog)\n    return log\n\n\ndef _flag_outliers(lat, lon, ts, v_max):\n    \"\"\"Flag fixes reachable only by an implausible jump.\n\n    A single bad fix produces a large jump in and a large jump out while leaving\n    the neighbours close together, so both conditions are required.\n    \"\"\"\n    n = len(lat)\n    out = np.zeros(n, dtype=bool)\n    if n < 3:\n        return out\n\n    d = haversine_m(lat[:-1], lon[:-1], lat[1:], lon[1:])\n    dt = np.diff(ts)\n    with np.errstate(divide=\"ignore\", invalid=\"ignore\"):\n        v = np.where(dt > 0, d / dt, np.inf)\n\n    fast_in, fast_out = v[:-1] > v_max, v[1:] > v_max\n    span = haversine_m(lat[:-2], lon[:-2], lat[2:], lon[2:])\n    out[1:-1] = fast_in & fast_out & (span < d[:-1] * 0.5)\n\n    # An isolated leading or trailing spike has only one neighbour to test.\n    if v[0] > v_max and not out[1]:\n        out[0] = True\n    if v[-1] > v_max and not out[-2]:\n        out[-1] = True\n    return out\n\n\ndef _windowed_speed(lat, lon, ts, keep, window_s):\n    \"\"\"Speed over a centred time window, so GPS jitter averages out.\"\"\"\n    n = len(lat)\n    speed = np.full(n, np.nan)\n    idx = np.flatnonzero(keep)\n    if idx.size < 2:\n        return speed\n\n    t = ts[idx]\n    half = window_s / 2.0\n    lo = np.searchsorted(t, t - half, side=\"left\")\n    hi = np.searchsorted(t, t + half, side=\"right\") - 1\n\n    span = t[hi] - t[lo]\n    ok = span >= min(3.0, window_s * 0.6)\n    if not ok.any():\n        return speed\n\n    a, b = idx[lo[ok]], idx[hi[ok]]\n    dist = haversine_m(lat[a], lon[a], lat[b], lon[b])\n    speed[idx[ok]] = dist / span[ok]\n    return speed\n\n\ndef _adaptive_cog(lat, lon, ts, keep, d_min, max_window_s):\n    \"\"\"Course over ground, measured over however long it takes to move d_min metres.\n\n    A fixed time window is useless here: 5 seconds at the observed 0.14 m/s\n    jitter spans 0.7 m, which is pure noise. Instead the window grows until the\n    boat has actually gone somewhere, and stays NaN if it never does.\n    \"\"\"\n    n = len(lat)\n    cog = np.full(n, np.nan)\n    idx = np.flatnonzero(keep)\n    if idx.size < 2:\n        return cog\n\n    la, lo_, t = lat[idx], lon[idx], ts[idx]\n    m = idx.size\n    j = 0\n    for i in range(m):\n        if j <= i:\n            j = i + 1\n        while j < m:\n            if t[j] - t[i] > max_window_s:\n                break\n            if haversine_m(la[i], lo_[i], la[j], lo_[j]) >= d_min:\n                break\n            j += 1\n        if j >= m or t[j] - t[i] > max_window_s:\n            continue\n        if haversine_m(la[i], lo_[i], la[j], lo_[j]) < d_min:\n            continue\n        cog[idx[i]] = bearing_deg(la[i], lo_[i], la[j], lo_[j])\n    return cog\n\n\nMIN_COG_SAMPLES = 50\nCONCLUSIVE_R = 0.35          # concentration the winning candidate must reach\nCONCLUSIVE_MARGIN_DEG = 15.0  # median-error gap the winner must open over second place\n\n\ndef convention_scoreboard(fix, heading_col=\"hdg\", heading_alive=True, min_samples=MIN_COG_SAMPLES):\n    \"\"\"Score candidate heading conventions against GPS course over ground.\n\n    Returns (table, verdict, detail). The table is ranked by median absolute\n    error; a compass that agrees with the direction of travel scores far below\n    the 90-degree random baseline.\n\n    Two things can make the comparison meaningless, and both are reported rather\n    than papered over: a frozen compass has no directional content to test, and\n    a boat that never moved has no course to test it against.\n    \"\"\"\n    if not heading_alive:\n        return pd.DataFrame(), \"unusable\", (\n            \"The compass is frozen in this log, so there is no heading variation \"\n            \"to compare against course. Nothing can be concluded here.\")\n\n    if \"cog\" not in fix.columns:\n        return pd.DataFrame(), \"unusable\", \"No course-over-ground was derived.\"\n\n    d = fix[[heading_col, \"cog\"]].dropna()\n    n = len(d)\n    if n < min_samples:\n        return pd.DataFrame(), \"insufficient\", (\n            f\"Only {n} fixes had both a live heading and real motion \"\n            f\"({min_samples} needed). The boat barely moved, so the compass \"\n            \"cannot be assessed.\")\n\n    h, c = d[heading_col].to_numpy(dtype=float), d[\"cog\"].to_numpy(dtype=float)\n    rows = []\n    for name, fn in CONVENTIONS.items():\n        err = np.abs(ang_diff(fn(c), h))\n        offset, R = circ_mean_R(ang_diff(h, fn(c)))\n        rows.append({\n            \"convention\": name,\n            \"n\": n,\n            \"mean_abs_err\": float(err.mean()),\n            \"median_abs_err\": float(np.median(err)),\n            \"circ_offset\": float(wrap180(offset)),\n            \"R\": R,\n        })\n    table = pd.DataFrame(rows).sort_values(\"median_abs_err\").reset_index(drop=True)\n\n    best, second = table.iloc[0], table.iloc[1]\n    margin = second[\"median_abs_err\"] - best[\"median_abs_err\"]\n    if best[\"R\"] >= CONCLUSIVE_R and margin >= CONCLUSIVE_MARGIN_DEG:\n        verdict, detail = \"conclusive\", (\n            f\"**{best['convention']}** wins with a median error of \"\n            f\"{best['median_abs_err']:.1f}\u00b0 over {n} samples, beating the next \"\n            f\"candidate by {margin:.0f}\u00b0. Against a 90\u00b0 random baseline this is \"\n            f\"a real agreement between compass and course.\")\n    else:\n        verdict, detail = \"inconclusive\", (\n            f\"No candidate separates cleanly (best median \"\n            f\"{best['median_abs_err']:.1f}\u00b0, concentration R={best['R']:.2f}, \"\n            f\"margin {margin:.0f}\u00b0). The apparent motion is likely receiver \"\n            f\"jitter rather than travel \u2014 treat this ranking as noise.\")\n    return table, verdict, detail\n\n\ndef wind_direction(heading, awa, sign=1.0):\n    \"\"\"Global direction the apparent wind blows FROM, clockwise from North.\"\"\"\n    return wrap360(np.asarray(heading, dtype=float) + sign * np.asarray(awa, dtype=float))\n\n\ndef wind_sign_evidence(fix, heading_alive=True, awa_alive=True):\n    \"\"\"Compare the two AWA sign conventions by how well each yields a steady wind.\n\n    Over a short window the true wind direction should be roughly constant, so\n    the correct sign produces a more concentrated set of derived directions.\n    This only means anything if both inputs vary: if the compass and the vane\n    are both stuck, every convention trivially yields R=1 and proves nothing.\n    \"\"\"\n    if not (heading_alive and awa_alive):\n        return {}, \"unusable\", (\n            \"Both a live compass and a live wind vane are needed to test the \"\n            \"sign convention. At least one is frozen in this log.\")\n\n    d = fix[[\"hdg\", \"awa\"]].dropna()\n    if len(d) < 50:\n        return {}, \"insufficient\", f\"Only {len(d)} samples with both channels.\"\n\n    h, a = d[\"hdg\"].to_numpy(dtype=float), d[\"awa\"].to_numpy(dtype=float)\n    out = {}\n    for label, sign in ((\"heading + AWA\", 1.0), (\"heading - AWA\", -1.0)):\n        mean, R = circ_mean_R(wind_direction(h, a, sign))\n        out[label] = {\"mean_dir\": mean, \"R\": R, \"n\": len(d)}\n\n    plus, minus = out[\"heading + AWA\"][\"R\"], out[\"heading - AWA\"][\"R\"]\n    better = \"heading + AWA\" if plus >= minus else \"heading - AWA\"\n    if max(plus, minus) < 0.30:\n        verdict, detail = \"weak\", (\n            f\"{better} is the better of the two (R={max(plus, minus):.3f} vs \"\n            f\"{min(plus, minus):.3f}), but neither produces a convincingly steady \"\n            \"wind direction. Treat wind overlays as indicative only.\")\n    else:\n        verdict, detail = \"supported\", (\n            f\"{better} produces a markedly steadier wind direction \"\n            f\"(R={max(plus, minus):.3f} vs {min(plus, minus):.3f}).\")\n    return out, verdict, detail\n\n\n# ----------------------------------------------------------------------- power\n\n# Power runs on raw rows, not on deduplicated fixes: consumption is a property\n# of the electrical system and keeps changing while the GPS repeats a fix.\n\n# Longer than this between rows means the logger stopped, not that the load held\n# steady, so the energy integral drops the gap rather than charging the whole\n# interval to the last sample. Rows land ~9 Hz apart, so this is generous.\nMAX_POWER_GAP_S = 5.0\n\n# The shunt reads a few milliamps of noise with nothing connected. Below this a\n# channel is treated as unloaded, which keeps implied bus voltage -- power over\n# current -- from being computed by dividing noise by noise.\nCURRENT_NOISE_A = 0.005\n\n\ndef power_summary(df, channels=POWER_CHANNELS):\n    \"\"\"Per-channel consumption over the rows handed in.\n\n    One dict per channel, always all of them and in order, so a channel that is\n    wired but idle stays visible instead of vanishing from the table. `present`\n    distinguishes \"logged nothing\" from \"logged zero\" -- the first means this\n    firmware or run had no monitor, the second means nothing drew current.\n    \"\"\"\n    out = []\n    ts = _epoch_seconds(df[\"t\"]) if len(df) else np.zeros(0)\n\n    for ch in channels:\n        row = {\"key\": ch.key, \"label\": ch.label, \"n\": 0, \"present\": False,\n               \"mean_w\": np.nan, \"peak_w\": np.nan, \"energy_wh\": 0.0,\n               \"mean_a\": np.nan, \"peak_a\": np.nan, \"bus_v\": np.nan}\n\n        w = _column(df, ch.power)\n        a = _column(df, ch.current)\n        finite = np.isfinite(w)\n        row[\"n\"] = int(finite.sum())\n        row[\"present\"] = bool(row[\"n\"])\n\n        if row[\"present\"]:\n            row[\"mean_w\"] = float(np.nanmean(w))\n            row[\"peak_w\"] = float(np.nanmax(w))\n            row[\"energy_wh\"] = _energy_wh(ts, w)\n        if np.isfinite(a).any():\n            row[\"mean_a\"] = float(np.nanmean(a))\n            row[\"peak_a\"] = float(np.nanmax(a))\n            # power = bus_voltage * current in the driver, so the division\n            # recovers a voltage the logger never wrote down.\n            loaded = np.isfinite(w) & (a > CURRENT_NOISE_A)\n            if loaded.any():\n                row[\"bus_v\"] = float(np.median(w[loaded] / a[loaded]))\n\n        out.append(row)\n    return out\n\n\ndef _column(df, name):\n    if name not in df.columns:\n        return np.full(len(df), np.nan)\n    return df[name].to_numpy(dtype=float)\n\n\n# ------------------------------------------------------- sail and navigation\n\n# Like power, these read raw rows rather than fixes: the sail logic re-decides\n# every cycle, so collapsing to GPS fixes would throw away most of its state.\n\ndef _text(df, name):\n    \"\"\"A category column as plain strings, \"\" where absent or null.\"\"\"\n    if name not in df.columns:\n        return pd.Series([\"\"] * len(df), index=df.index, dtype=object)\n    col = df[name]\n    return col.astype(object).where(col.notna(), \"\").astype(str)\n\n\ndef _time_frac(df, mask):\n    \"\"\"Fraction of elapsed time the mask holds, weighting each row by its own\n    interval so a logging gap cannot inflate whichever state preceded it.\"\"\"\n    if len(df) < 2:\n        return float(mask.mean()) if len(df) else 0.0\n    dt = np.clip(np.diff(_epoch_seconds(df[\"t\"])), 0.0, MAX_POWER_GAP_S)\n    total = dt.sum()\n    if total <= 0:\n        return 0.0\n    return float(dt[np.asarray(mask)[:-1]].sum() / total)\n\n\ndef sail_summary(df) -> dict:\n    \"\"\"What the sail logic was doing over the rows handed in.\"\"\"\n    out = {\"n\": len(df), \"present\": False, \"frac_sail\": np.nan, \"frac_motor\": np.nan,\n           \"frac_beating\": np.nan, \"frac_motor_assist\": np.nan,\n           \"n_tacks\": 0, \"states\": {}, \"faults\": []}\n    if df.empty:\n        return out\n\n    propulsion = _text(df, \"propulsion\")\n    state = _text(df, \"sail_state\")\n    out[\"present\"] = bool((propulsion != \"\").any() or (state != \"\").any())\n    if not out[\"present\"]:\n        return out\n\n    out[\"frac_sail\"] = _time_frac(df, propulsion == \"sail\")\n    out[\"frac_motor\"] = _time_frac(df, propulsion == \"motor\")\n    out[\"frac_beating\"] = _time_frac(df, _text(df, \"beating\") == \"True\")\n    out[\"frac_motor_assist\"] = _time_frac(df, _text(df, \"motor_assist\") == \"True\")\n\n    seen = state[state != \"\"]\n    out[\"states\"] = seen.value_counts().to_dict()\n\n    # A tack is a sign change while the value is actually being logged; the\n    # blank stretches between AUTO runs would otherwise each read as two tacks.\n    tack = _column(df, \"tack\")\n    ok = np.isfinite(tack)\n    if ok.any():\n        s = np.sign(tack[ok])\n        out[\"n_tacks\"] = int((np.diff(s) != 0).sum())\n\n    fault = _text(df, \"sail_fault\")\n    bad = (fault != \"\") & (fault != SAIL_FAULT_OK)\n    if bad.any():\n        t = df[\"t\"].to_numpy()\n        for value, i0, i1 in _runs(fault.to_numpy(), bad.to_numpy()):\n            out[\"faults\"].append((value, t[i0], t[i1]))\n    return out\n\n\ndef nav_summary(df) -> dict:\n    \"\"\"How well the autopilot held its line over the rows handed in.\"\"\"\n    out = {\"n\": 0, \"present\": False, \"wp_start\": np.nan, \"wp_end\": np.nan,\n           \"mean_abs_err\": np.nan, \"rms_xte\": np.nan, \"max_abs_xte\": np.nan,\n           \"dist_end\": np.nan}\n    if df.empty:\n        return out\n\n    des = _column(df, \"des_hdg_deg\")\n    ok = np.isfinite(des)\n    out[\"n\"] = int(ok.sum())\n    out[\"present\"] = bool(out[\"n\"])\n    if not out[\"present\"]:\n        return out\n\n    err = _column(df, \"err_deg\")\n    err = err[np.isfinite(err)]\n    if err.size:\n        out[\"mean_abs_err\"] = float(np.mean(np.abs(err)))\n\n    xte = _column(df, \"xte_m\")\n    xte = xte[np.isfinite(xte)]\n    if xte.size:\n        out[\"rms_xte\"] = float(np.sqrt(np.mean(xte ** 2)))\n        out[\"max_abs_xte\"] = float(np.max(np.abs(xte)))\n\n    wp = _column(df, \"wp_left\")\n    wp = wp[np.isfinite(wp)]\n    if wp.size:\n        out[\"wp_start\"], out[\"wp_end\"] = float(wp[0]), float(wp[-1])\n\n    dist = _column(df, \"dist_m\")\n    dist = dist[np.isfinite(dist)]\n    if dist.size:\n        out[\"dist_end\"] = float(dist[-1])\n    return out\n\n\ndef _runs(values, mask):\n    \"\"\"Contiguous runs where mask holds, as (value, first index, last index).\"\"\"\n    spans, start = [], None\n    for i, on in enumerate(mask):\n        if on and start is None:\n            start = i\n        elif not on and start is not None:\n            spans.append((values[start], start, i - 1))\n            start = None\n    if start is not None:\n        spans.append((values[start], start, len(mask) - 1))\n    return spans\n\n\ndef _energy_wh(ts, w):\n    \"\"\"Trapezoidal integral of watts over seconds, in watt-hours.\"\"\"\n    if len(w) < 2:\n        return 0.0\n    dt = np.clip(np.diff(ts), 0.0, MAX_POWER_GAP_S)\n    return float(np.nansum((w[:-1] + w[1:]) / 2.0 * dt) / 3600.0)\n"}, "boatviz\\export.py": {"data": "\"\"\"Export filtered selections to GeoJSON.\"\"\"\n\nimport json\n\nimport numpy as np\nimport pandas as pd\n\nPOINT_FIELDS = [\"row\", \"hdg\", \"cog\", \"resid\", \"awa\", \"speed\", \"dwell\", \"source\",\n                \"mode\", \"auto_mode\",\n                \"aws\", \"twd\", \"twa\", \"tws\",\n                \"des_hdg\", \"brg\", \"err\", \"xte\", \"dist\", \"wp_left\",\n                \"rudder\", \"sail\", \"thr\", \"tack\", \"fix_q\",\n                \"sail_state\", \"sail_fault\", \"sail_reason\", \"propulsion\",\n                \"beating\", \"motor_assist\"]\n\n\ndef _clean(v):\n    if v is None:\n        return None\n    if isinstance(v, (np.floating, float)):\n        return None if not np.isfinite(v) else round(float(v), 6)\n    if isinstance(v, (np.integer, int)):\n        return int(v)\n    if isinstance(v, (np.bool_, bool)):\n        return bool(v)\n    return str(v)\n\n\ndef to_geojson(fix, log_id=\"\", include_points=True) -> str:\n    \"\"\"FeatureCollection with the track as a LineString plus optional points.\"\"\"\n    features = []\n\n    if len(fix) >= 2:\n        features.append({\n            \"type\": \"Feature\",\n            \"geometry\": {\"type\": \"LineString\",\n                         \"coordinates\": fix[[\"lon\", \"lat\"]].to_numpy().tolist()},\n            \"properties\": {\n                \"log\": log_id, \"kind\": \"track\", \"fixes\": int(len(fix)),\n                \"start\": str(fix[\"t\"].iloc[0]), \"end\": str(fix[\"t\"].iloc[-1]),\n            },\n        })\n\n    if include_points:\n        for _, r in fix.iterrows():\n            props = {\"log\": log_id, \"kind\": \"fix\",\n                     \"t_iso\": str(pd.Timestamp(r[\"t\"]))}\n            props.update({f: _clean(r.get(f)) for f in POINT_FIELDS if f in fix.columns})\n            features.append({\n                \"type\": \"Feature\",\n                \"geometry\": {\"type\": \"Point\",\n                             \"coordinates\": [float(r[\"lon\"]), float(r[\"lat\"])]},\n                \"properties\": props,\n            })\n\n    return json.dumps({\"type\": \"FeatureCollection\", \"features\": features})\n\n\ndef qa_summary(log) -> str:\n    \"\"\"Plain-text sensor-health report, suitable for pasting into notes.\"\"\"\n    qa = log.qa\n    bb = log.bbox()\n    lines = [\n        f\"{log.id}\",\n        f\"  file      {log.path}  ({log.size / 1e6:.1f} MB)\",\n        f\"  rows      {log.n_rows:,}   GPS rows {getattr(log, 'n_gps_rows', 0):,}\",\n        f\"  fixes     {log.n_fixes:,}  ({qa.dup_frac * 100:.1f}% duplicates removed)\",\n        f\"  span      {log.t_start} -> {log.t_end}  ({log.duration_s / 3600:.2f} h)\",\n    ]\n    if bb:\n        lines.append(f\"  area      {bb[4]:.0f} x {bb[5]:.0f} m\")\n    lines.append(f\"  GPS       {qa.gps_verdict}  ({qa.moving_frac * 100:.1f}% of fixes moving)\")\n    if qa.n_outliers:\n        lines.append(f\"  rejected  {qa.n_outliers} implausible fix(es)\")\n    if qa.monotonic_breaks:\n        lines.append(f\"  warning   {qa.monotonic_breaks} non-monotonic timestamps\")\n    lines.append(\"  channels:\")\n    for key, rep in qa.channels.items():\n        lines.append(f\"    {rep.verdict:9s} {rep.label:28s} {rep.summary}\")\n    return \"\\n\".join(lines)\n"}, "boatviz\\geo.py": {"data": "\"\"\"Geodesy and circular statistics.\"\"\"\n\nimport numpy as np\n\nEARTH_R = 6371008.8\n\n\ndef wrap360(deg):\n    return np.mod(deg, 360.0)\n\n\ndef wrap180(deg):\n    return np.mod(deg + 180.0, 360.0) - 180.0\n\n\ndef ang_diff(a, b):\n    \"\"\"Smallest signed difference a - b, in (-180, 180].\"\"\"\n    return wrap180(np.asarray(a, dtype=float) - np.asarray(b, dtype=float))\n\n\ndef circ_mean_R(deg):\n    \"\"\"Circular mean direction and concentration R in [0, 1].\n\n    R near 1 means tightly clustered; R near 0 means uniformly spread.\n    \"\"\"\n    d = np.asarray(deg, dtype=float)\n    d = d[np.isfinite(d)]\n    if d.size == 0:\n        return np.nan, 0.0\n    r = np.radians(d)\n    s, c = np.sin(r).sum(), np.cos(r).sum()\n    R = float(np.hypot(s, c) / d.size)\n    return float(np.degrees(np.arctan2(s, c)) % 360.0), R\n\n\ndef circ_spread_deg(deg):\n    \"\"\"Circular standard deviation in degrees, derived from the concentration.\n\n    This is the frozen-channel detector. Counting distinct values does not work:\n    a frozen heading channel dithers in the 4th decimal and shows ~77000 distinct\n    values across a 0.3 deg range.\n    \"\"\"\n    _, R = circ_mean_R(deg)\n    R = min(max(R, 1e-12), 1.0)\n    return float(np.degrees(np.sqrt(max(0.0, -2.0 * np.log(R)))))\n\n\ndef meters_per_deg(lat_deg):\n    \"\"\"Metres per degree of latitude and longitude at a given latitude.\"\"\"\n    lat = np.radians(lat_deg)\n    return 111132.92 - 559.82 * np.cos(2 * lat), 111412.84 * np.cos(lat)\n\n\ndef haversine_m(lat1, lon1, lat2, lon2):\n    p1, p2 = np.radians(lat1), np.radians(lat2)\n    dp = p2 - p1\n    dl = np.radians(np.asarray(lon2) - np.asarray(lon1))\n    a = np.sin(dp / 2) ** 2 + np.cos(p1) * np.cos(p2) * np.sin(dl / 2) ** 2\n    return 2 * EARTH_R * np.arcsin(np.sqrt(np.clip(a, 0, 1)))\n\n\ndef bearing_deg(lat1, lon1, lat2, lon2):\n    \"\"\"Initial great-circle bearing, degrees clockwise from North.\"\"\"\n    p1, p2 = np.radians(lat1), np.radians(lat2)\n    dl = np.radians(np.asarray(lon2) - np.asarray(lon1))\n    y = np.sin(dl) * np.cos(p2)\n    x = np.cos(p1) * np.sin(p2) - np.sin(p1) * np.cos(p2) * np.cos(dl)\n    return wrap360(np.degrees(np.arctan2(y, x)))\n\n\ndef offset_latlon(lat, lon, bearing_deg_cw, dist_m):\n    \"\"\"Point reached by travelling dist_m along a clockwise compass bearing.\n\n    Uses a local flat-earth approximation, which is exact enough at the\n    50-400 m scales these logs cover.\n    \"\"\"\n    m_lat, m_lon = meters_per_deg(np.asarray(lat, dtype=float))\n    th = np.radians(np.asarray(bearing_deg_cw, dtype=float))\n    return lat + np.cos(th) * dist_m / m_lat, lon + np.sin(th) * dist_m / np.maximum(m_lon, 1e-9)\n"}, "boatviz\\ingest.py": {"data": "\"\"\"Load boat CSV logs into a compact in-memory form.\n\nIngest does three things: parse, reject invalid GPS, and collapse the ~89% of\nGPS rows that merely repeat the previous fix (the logger samples at ~10 Hz\nagainst a ~1 Hz receiver).\n\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nfrom .geo import haversine_m\nfrom .schema import (BOOL_COLUMNS, CATEGORY_COLUMNS, CHANNELS, DISCRETE_NUMERIC,\n                     POWER_COLUMNS, detect_columns)\n\n# Latitude and longitude must stay float64. At 47 deg N a float32 mantissa\n# quantizes position to ~0.6 m, which silently merges genuinely distinct GPS\n# fixes during deduplication.\nGPS_COLUMNS = [\"gps_lat\", \"gps_lon\"]\nSCALAR_COLUMNS = [c.key for c in CHANNELS] + DISCRETE_NUMERIC\nNUMERIC_COLUMNS = GPS_COLUMNS + SCALAR_COLUMNS + POWER_COLUMNS\n\n# Columns carried from the raw rows onto the deduplicated fixes, as\n# (raw name, fix name). Short names on the fix side match the existing\n# hdg/awa convention. Everything downstream of the fix frame -- the map,\n# the GeoJSON export, the Data tab -- sees exactly this list.\nFIX_PROJECTION = [\n    (\"gps_lat\", \"lat\"), (\"gps_lon\", \"lon\"),\n    (\"heading\", \"hdg\"), (\"geomag_rotation_vector\", \"geomag\"),\n    (\"gyro_z_dps\", \"gyro\"), (\"heading_source\", \"source\"),\n    (\"mode\", \"mode\"), (\"auto_mode\", \"auto_mode\"),\n    (\"awa_deg\", \"awa\"), (\"wind_spd\", \"aws\"),\n    (\"twd_deg\", \"twd\"), (\"twa_deg\", \"twa\"), (\"tws_mps\", \"tws\"),\n    (\"des_hdg_deg\", \"des_hdg\"), (\"brg_deg\", \"brg\"), (\"err_deg\", \"err\"),\n    (\"xte_m\", \"xte\"), (\"dist_m\", \"dist\"), (\"wp_left\", \"wp_left\"),\n    (\"rudder_deg\", \"rudder\"), (\"sail_deg\", \"sail\"), (\"thr_us\", \"thr\"),\n    (\"sail_state\", \"sail_state\"), (\"sail_fault\", \"sail_fault\"),\n    (\"sail_reason\", \"sail_reason\"), (\"propulsion\", \"propulsion\"),\n    (\"beating\", \"beating\"), (\"motor_assist\", \"motor_assist\"),\n    (\"tack\", \"tack\"), (\"fix_q\", \"fix_q\"),\n]\n\nSTATUS_OK = \"ok\"\nSTATUS_EMPTY = \"empty\"\nSTATUS_FRAGMENT = \"fragment\"\nSTATUS_NO_GPS = \"no_gps\"\nSTATUS_ERROR = \"error\"\n\n\n@dataclass\nclass Log:\n    id: str\n    path: Path\n    size: int\n    status: str\n    message: str = \"\"\n    df: pd.DataFrame = field(default_factory=pd.DataFrame)\n    fix: pd.DataFrame = field(default_factory=pd.DataFrame)\n    qa: object = None\n\n    @property\n    def n_rows(self) -> int:\n        return len(self.df)\n\n    @property\n    def n_fixes(self) -> int:\n        return len(self.fix)\n\n    @property\n    def has_track(self) -> bool:\n        return self.status == STATUS_OK and len(self.fix) >= 2\n\n    @property\n    def t_start(self):\n        return self.df[\"t\"].iloc[0] if len(self.df) else None\n\n    @property\n    def t_end(self):\n        return self.df[\"t\"].iloc[-1] if len(self.df) else None\n\n    @property\n    def duration_s(self) -> float:\n        if len(self.df) < 2:\n            return 0.0\n        return (self.df[\"t\"].iloc[-1] - self.df[\"t\"].iloc[0]).total_seconds()\n\n    def bbox(self):\n        \"\"\"(min_lat, max_lat, min_lon, max_lon, width_m, height_m).\"\"\"\n        if not len(self.fix):\n            return None\n        la, lo = self.fix[\"lat\"].to_numpy(), self.fix[\"lon\"].to_numpy()\n        mnla, mxla, mnlo, mxlo = la.min(), la.max(), lo.min(), lo.max()\n        h = haversine_m(mnla, mnlo, mxla, mnlo)\n        w = haversine_m(mnla, mnlo, mnla, mxlo)\n        return mnla, mxla, mnlo, mxlo, float(w), float(h)\n\n\ndef discover_logs(folder) -> list[Path]:\n    folder = Path(folder).expanduser()\n    if not folder.is_dir():\n        return []\n    return sorted(p for p in folder.glob(\"*.csv\") if not p.name.startswith(\".\"))\n\n\ndef load_log(source, log_id: str | None = None, size: int | None = None) -> Log:\n    \"\"\"Parse one log.\n\n    `source` is a filesystem path or any file-like object with a name, so the\n    same code path serves both a local folder and a browser upload.\n    \"\"\"\n    if hasattr(source, \"read\"):\n        name = getattr(source, \"name\", \"uploaded.csv\")\n        path = Path(name)\n        lid = log_id or path.stem\n        size = size if size is not None else getattr(source, \"size\", None)\n        if size is None:\n            pos = source.tell()\n            source.seek(0, 2)\n            size = source.tell()\n            source.seek(pos)\n    else:\n        path = Path(source)\n        lid = log_id or path.stem\n        size = path.stat().st_size if path.exists() else 0\n\n    if not size:\n        return Log(lid, path, size or 0, STATUS_EMPTY, \"empty file (0 bytes)\")\n\n    try:\n        if hasattr(source, \"seek\"):\n            source.seek(0)\n        raw = pd.read_csv(source, engine=\"c\", low_memory=False)\n    except Exception as exc:                                   # noqa: BLE001\n        return Log(lid, path, size, STATUS_ERROR, f\"parse failed: {exc}\")\n\n    if raw.empty:\n        return Log(lid, path, size, STATUS_EMPTY, \"no data rows\")\n\n    cols = detect_columns(raw.columns)\n    if \"ts_iso\" not in cols:\n        return Log(lid, path, size, STATUS_ERROR, \"no timestamp column found\")\n\n    df = pd.DataFrame(index=range(len(raw)))\n    df[\"row\"] = np.arange(len(raw), dtype=np.int64)\n    df[\"t\"] = pd.to_datetime(raw[cols[\"ts_iso\"]], format=\"ISO8601\", utc=True, errors=\"coerce\")\n\n    for name in NUMERIC_COLUMNS:\n        src = cols.get(name)\n        dtype = \"float64\" if name in GPS_COLUMNS else \"float32\"\n        df[name] = (pd.to_numeric(raw[src], errors=\"coerce\").astype(dtype)\n                    if src is not None else np.array(np.nan, dtype=dtype))\n\n    # Deliberately category rather than the nullable \"string\" dtype: these\n    # frames get pickled by Streamlit's cache, and StringDtype does not survive\n    # that round-trip on older pandas builds (notably the one bundled with\n    # Pyodide, which raises NotImplementedError on unpickling). Each of these\n    # holds only a handful of distinct values, so category is also far smaller.\n    # A missing column becomes an empty string rather than being skipped, so\n    # every consumer sees the same frame shape whichever firmware wrote the log.\n    for name in CATEGORY_COLUMNS:\n        src = cols.get(name)\n        values = (raw[src].astype(object).where(raw[src].notna(), \"\")\n                  if src is not None else pd.Series(\"\", index=raw.index))\n        df[name] = pd.Series(values.to_numpy(), index=df.index).astype(\"category\")\n\n    # The firmware writes these as the text \"True\"/\"False\", but a column that\n    # happens to be filled on every row is parsed back as a real bool dtype,\n    # so both forms have to land on the same three category values.\n    for name in BOOL_COLUMNS:\n        src = cols.get(name)\n        if src is not None:\n            values = raw[src].map({True: \"True\", False: \"False\",\n                                   \"True\": \"True\", \"False\": \"False\"})\n            values = values.where(values.notna(), \"\")\n        else:\n            values = pd.Series(\"\", index=raw.index)\n        df[name] = pd.Series(values.to_numpy(), index=df.index).astype(\"category\")\n\n    df = df[df[\"t\"].notna()].reset_index(drop=True)\n    if df.empty:\n        return Log(lid, path, size, STATUS_ERROR, \"no parseable timestamps\")\n\n    monotonic_breaks = int((df[\"t\"].diff() < pd.Timedelta(0)).sum())\n    fix = _build_fixes(df)\n\n    if len(df) < 2:\n        return Log(lid, path, size, STATUS_FRAGMENT, f\"{len(df)} row\", df=df, fix=fix)\n\n    log = Log(lid, path, size, STATUS_OK, df=df, fix=fix)\n    log.monotonic_breaks = monotonic_breaks\n    log.n_gps_rows = int(_valid_gps_mask(df).sum())\n\n    if len(fix) < 2:\n        log.status = STATUS_NO_GPS\n        log.message = \"no usable GPS fixes\"\n    elif len(df) < 800:\n        log.status = STATUS_FRAGMENT\n        log.message = f\"{len(df)} rows\"\n    return log\n\n\ndef _valid_gps_mask(df: pd.DataFrame) -> pd.Series:\n    lat, lon = df[\"gps_lat\"], df[\"gps_lon\"]\n    return (lat.notna() & lon.notna()\n            & ~((lat == 0) & (lon == 0))\n            & lat.between(-90, 90) & lon.between(-180, 180))\n\n\ndef _build_fixes(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Deduplicate consecutive identical GPS fixes, keeping the first occurrence.\n\n    The first occurrence is closest to the true fix time; later repeats are just\n    the logger re-reading a stale value. dwell records how long each fix persisted.\n    \"\"\"\n    valid = _valid_gps_mask(df)\n    g = df.loc[valid, [\"row\", \"t\"] + [src for src, _ in FIX_PROJECTION]]\n    if g.empty:\n        return pd.DataFrame(columns=[\"row\", \"t\"]\n                            + [dst for _, dst in FIX_PROJECTION] + [\"dwell\"])\n\n    changed = (g[\"gps_lat\"] != g[\"gps_lat\"].shift()) | (g[\"gps_lon\"] != g[\"gps_lon\"].shift())\n    fix = g[changed].copy()\n    fix = fix.rename(columns=dict(FIX_PROJECTION))\n    fix[\"lat\"] = fix[\"lat\"].astype(\"float64\")\n    fix[\"lon\"] = fix[\"lon\"].astype(\"float64\")\n\n    t = fix[\"t\"].to_numpy()\n    dwell = np.diff(t).astype(\"timedelta64[ms]\").astype(np.float64) / 1000.0\n    fix[\"dwell\"] = np.append(dwell, np.nan).astype(\"float32\")\n    return fix.reset_index(drop=True)\n"}, "boatviz\\mapview.py": {"data": "\"\"\"Folium map construction.\n\nFolium rather than pydeck because these logs cover areas only 60-400 m across.\nThat demands satellite imagery zoomed past its native tile level, which needs\nexplicit max_native_zoom/max_zoom control and a token-free imagery source --\nboth of which Leaflet gives directly and pydeck does not.\n\"\"\"\n\nimport html\nfrom dataclasses import dataclass\n\nimport branca.colormap as cm\nimport folium\nimport numpy as np\nimport pandas as pd\nfrom folium.plugins import Fullscreen, MeasureControl, MousePosition\n\nfrom .derive import wind_direction\nfrom .geo import offset_latlon, wrap360\nfrom .schema import (AUTO_MODE_LABELS, PROPULSION_COLORS, SAIL_STATE_COLORS,\n                     TACK_COLORS, TACK_LABELS)\n\n# Native tiles stop at 19; allowing zoom to 22 upscales them instead of going\n# blank, which is what lets a 90 m track fill the viewport.\nMAX_NATIVE_ZOOM = 19\nMAX_ZOOM = 22\n\nBASEMAPS = {\n    \"Satellite (Esri)\": dict(\n        tiles=\"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}\",\n        attr=\"Tiles &copy; Esri\"),\n    \"Street (OSM)\": dict(\n        tiles=\"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png\",\n        attr=\"&copy; OpenStreetMap contributors\"),\n    \"Light (Carto)\": dict(\n        tiles=\"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png\",\n        attr=\"&copy; OpenStreetMap, &copy; CARTO\"),\n    \"Dark (Carto)\": dict(\n        tiles=\"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png\",\n        attr=\"&copy; OpenStreetMap, &copy; CARTO\"),\n}\n\nLOG_COLORS = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#9457c9\",\n              \"#d64b8a\", \"#0f9bb5\", \"#c99a1e\", \"#6b7280\"]\n\nARROW_COLORS = {\n    \"heading\": \"#eb6834\",\n    \"cog\": \"#1baf7a\",\n    \"wind_from\": \"#9457c9\",\n    \"wind_to\": \"#c07fe0\",\n    \"twd\": \"#0f9bb5\",\n    \"des_hdg\": \"#c99a1e\",\n}\n\nARROW_LABELS = {\n    \"heading\": \"heading\",\n    \"cog\": \"course over ground\",\n    \"wind_from\": \"apparent wind, from (derived)\",\n    \"wind_to\": \"apparent wind, to (derived)\",\n    \"twd\": \"true wind, from (logged)\",\n    \"des_hdg\": \"desired heading\",\n}\n\n# Control mode is categorical, so it gets fixed colours rather than a ramp:\n# MANUAL and AUTO must stay distinguishable at a glance, which is the whole\n# point of colouring by it. Keyed by the names boatv1/utils/modes.py writes.\nMODE_COLORS = {\n    \"MANUAL\": \"#2a78d6\",\n    \"SIM_STEERED\": \"#0f9bb5\",\n    \"HYBRID\": \"#c99a1e\",\n    \"AUTO\": \"#1baf7a\",\n    \"RESET\": \"#d03b3b\",\n    \"\": \"#898781\",          # column absent, or the row predates nav logging\n}\n\n# A value the firmware gained after this app was written still draws, in a colour\n# no listed value uses, so it shows up as new rather than passing for grey.\nUNKNOWN_MODE_COLOR = \"#9457c9\"\n\n\n@dataclass(frozen=True)\nclass CategoricalColoring:\n    \"\"\"A fix column whose values are named states rather than a measurement.\"\"\"\n    column: str\n    title: str          # legend heading\n    colors: dict        # value -> colour, including \"\" for \"not recorded\"\n    labeler: object = None   # optional raw value -> display string\n\n    def text(self, view):\n        \"\"\"Values as display strings, \"\" where the column was never logged.\"\"\"\n        if self.column not in view.columns:\n            return np.array([\"\"] * len(view), dtype=object)\n        col = view[self.column]\n        if self.labeler is not None:\n            return np.array([self.labeler(v) for v in col.to_numpy()], dtype=object)\n        return col.astype(object).where(col.notna(), \"\").astype(str).to_numpy()\n\n    def color(self, value):\n        return self.colors.get(str(value), UNKNOWN_MODE_COLOR)\n\n\ndef _tack_label(v):\n    try:\n        return TACK_LABELS.get(int(np.sign(float(v))), \"\") if np.isfinite(float(v)) else \"\"\n    except (TypeError, ValueError):\n        return \"\"\n\n\nCATEGORICALS = {\n    \"mode\": CategoricalColoring(\"mode\", \"Control mode\", MODE_COLORS),\n    \"sail_state\": CategoricalColoring(\"sail_state\", \"Sail state\", SAIL_STATE_COLORS),\n    \"propulsion\": CategoricalColoring(\"propulsion\", \"Propulsion\", PROPULSION_COLORS),\n    \"tack\": CategoricalColoring(\n        \"tack\", \"Tack\",\n        {v: TACK_COLORS[k] for k, v in TACK_LABELS.items()} | {\"\": TACK_COLORS[\"\"]},\n        labeler=_tack_label),\n}\n\n\ndef build_map(logs, *, basemap=\"Satellite (Esri)\", color_by=\"log\",\n              show_track=True, show_points=True, point_budget=3000,\n              arrows=(), arrow_budget=150, arrow_len_m=6.0,\n              convention=\"CW (clockwise, N=0 E=90)\", wind_sign=1.0,\n              moving_only=False, cursor=None, markers=(), fit_markers=False):\n    \"\"\"Assemble the Folium map for the currently selected logs and filters.\"\"\"\n    tracks = [lg for lg in logs if lg.has_track and len(lg.view) >= 1]\n    m = _base_map(tracks, basemap,\n                  [(mk.lat, mk.lon) for mk in markers] if fit_markers else ())\n    _add_markers(m, markers)\n    if not tracks:\n        return m\n\n    scale = _color_scale(tracks, color_by)\n    spec = CATEGORICALS.get(color_by)\n    values_drawn = set()\n\n    for i, lg in enumerate(tracks):\n        base = LOG_COLORS[i % len(LOG_COLORS)]\n        view = lg.view\n        if moving_only and \"moving\" in view.columns:\n            view = view[view[\"moving\"]]\n        if view.empty:\n            continue\n        if spec is not None:\n            values_drawn.update(spec.text(view).tolist())\n\n        group = folium.FeatureGroup(name=f\"{lg.id}\", show=True)\n\n        if show_track:\n            _add_track(group, view, color_by, base, scale)\n        if show_points:\n            _add_points(group, view, lg.id, color_by, base, scale, point_budget)\n        for kind in arrows:\n            _add_arrows(group, view, kind, arrow_budget, arrow_len_m,\n                        convention, wind_sign)\n        group.add_to(m)\n\n    if cursor is not None:\n        _add_cursor(m, cursor, convention, wind_sign)\n    if scale is not None:\n        scale.add_to(m)\n    if spec is not None:\n        _add_cat_legend(m, spec, values_drawn)\n\n    folium.LayerControl(collapsed=False).add_to(m)\n    return m\n\n\ndef _base_map(tracks, basemap, extra_points=()):\n    cfg = BASEMAPS.get(basemap, BASEMAPS[\"Satellite (Esri)\"])\n    m = folium.Map(location=[47.695, 9.194], zoom_start=17, tiles=None,\n                   prefer_canvas=True, control_scale=True)\n\n    folium.TileLayer(tiles=cfg[\"tiles\"], attr=cfg[\"attr\"], name=basemap,\n                     max_native_zoom=MAX_NATIVE_ZOOM, max_zoom=MAX_ZOOM,\n                     overlay=False, control=False).add_to(m)\n\n    Fullscreen(position=\"topleft\").add_to(m)\n    MousePosition(position=\"bottomleft\", separator=\", \", num_digits=6,\n                  prefix=\"lat, lon:\", empty_string=\"\").add_to(m)\n    MeasureControl(position=\"topleft\", primary_length_unit=\"meters\",\n                   primary_area_unit=\"sqmeters\").add_to(m)\n\n    bounds = _bounds(tracks, extra_points)\n    if bounds:\n        m.fit_bounds(bounds, padding=(24, 24))\n    return m\n\n\ndef _bounds(tracks, extra_points=()):\n    \"\"\"Extent of the tracks, optionally widened to take in loose points.\n\n    Markers are only included on request. A mistyped coordinate would otherwise\n    pull the view out to sea and shrink a 90 m track to a dot, with nothing on\n    screen to explain why.\n    \"\"\"\n    pts = [(lg.view[\"lat\"].min(), lg.view[\"lon\"].min(),\n            lg.view[\"lat\"].max(), lg.view[\"lon\"].max())\n           for lg in tracks if len(lg.view)]\n    pts += [(lat, lon, lat, lon) for lat, lon in extra_points]\n    if not pts:\n        return None\n    a = np.array(pts)\n    return [[a[:, 0].min(), a[:, 1].min()], [a[:, 2].max(), a[:, 3].max()]]\n\n\n# ---------------------------------------------------------------- colouring\n\nCYCLIC_STEPS = [\"#d94a4a\", \"#d98a2b\", \"#c9c02e\", \"#5fb84a\", \"#2eb5a5\",\n                \"#3d8fd6\", \"#7a5fd0\", \"#c454b0\", \"#d94a4a\"]\n\n\ndef _color_scale(tracks, color_by):\n    \"\"\"Return a branca colormap for continuous variables, or None.\n\n    Categorical variables get their own discrete legend instead -- a continuous\n    ramp over mode names would imply an ordering the values do not have.\n    \"\"\"\n    if color_by in CATEGORICALS or color_by in (\"log\", \"heading_source\", \"none\"):\n        return None\n\n    col = COLOR_COLUMNS.get(color_by)\n    if col is None:\n        return None\n\n    if color_by in (\"heading\", \"awa\"):\n        # Direction is circular: a linear ramp would invent a discontinuity\n        # between 359 and 0 degrees, so the ramp wraps back to its start.\n        return cm.LinearColormap(CYCLIC_STEPS, vmin=0, vmax=360,\n                                 caption=f\"{color_by} (deg, clockwise from N)\")\n\n    vals = pd.concat([lg.view[col] for lg in tracks if col in lg.view]).dropna()\n    if vals.empty:\n        return None\n\n    if color_by == \"time\":\n        lo, hi = vals.min().value / 1e9, vals.max().value / 1e9\n        return cm.LinearColormap([\"#cde2fb\", \"#5ba3e8\", \"#1d5fa8\", \"#0d366b\"],\n                                 vmin=lo, vmax=hi, caption=\"time (earlier to later)\")\n\n    if color_by == \"xte\":\n        # Cross-track error is signed and its zero is the thing being judged, so\n        # it gets a diverging ramp centred there rather than a one-ended one.\n        # The span is symmetric, or one side of the line would read as worse\n        # than the other purely because the boat spent longer on it.\n        lim = float(np.nanpercentile(np.abs(vals), 98)) or 1.0\n        return cm.LinearColormap([\"#1d5fa8\", \"#a9cdf2\", \"#f2f0e9\", \"#f0a58a\", \"#c0392b\"],\n                                 vmin=-lim, vmax=lim,\n                                 caption=\"cross-track error (m, 0 = on the line)\")\n\n    hi = float(np.nanpercentile(vals, 98)) or 1.0\n    caption = \"true wind speed (m/s)\" if color_by == \"tws\" else \"speed (m/s)\"\n    return cm.LinearColormap([\"#e8f2d8\", \"#9ccb6b\", \"#3f9a4a\", \"#0d5c3a\"],\n                             vmin=0, vmax=hi, caption=caption)\n\n\n# Continuous colour-by choices, mapped onto the fix column each one reads.\nCOLOR_COLUMNS = {\"time\": \"t\", \"speed\": \"speed\", \"heading\": \"hdg\", \"awa\": \"awa\",\n                 \"xte\": \"xte\", \"tws\": \"tws\"}\n\n\ndef _values_for(view, color_by):\n    if color_by == \"time\":\n        return view[\"t\"].astype(\"int64\") / 1e9\n    return view.get(COLOR_COLUMNS.get(color_by))\n\n\ndef mode_color(value):\n    return MODE_COLORS.get(str(value), UNKNOWN_MODE_COLOR)\n\n\ndef _point_colors(view, color_by, base, scale):\n    spec = CATEGORICALS.get(color_by)\n    if spec is not None:\n        return [spec.color(v) for v in spec.text(view)]\n    if scale is None or color_by in (\"log\", \"none\"):\n        return [base] * len(view)\n    vals = _values_for(view, color_by)\n    if vals is None:\n        return [base] * len(view)\n    return [base if not np.isfinite(v) else scale(v) for v in np.asarray(vals, dtype=float)]\n\n\ndef _add_cat_legend(m, spec, values):\n    \"\"\"Discrete swatch legend, in place of the colormap bar a ramp would add.\"\"\"\n    if not values:\n        return\n    known = [k for k in spec.colors if k in values]\n    ordered = known + sorted(v for v in values if v not in spec.colors)\n\n    rows = \"\".join(\n        \"<div style='display:flex;align-items:center;gap:6px;margin:2px 0'>\"\n        f\"<span style='width:12px;height:12px;border-radius:2px;flex:none;\"\n        f\"background:{spec.color(v)}'></span>\"\n        f\"<span>{html.escape(v) if v else 'not recorded'}</span></div>\"\n        for v in ordered)\n\n    # Fixed light card rather than theme-aware colours: this sits on top of a\n    # satellite or dark basemap, neither of which follows the app's theme.\n    m.get_root().html.add_child(folium.Element(\n        \"<div style='position:fixed;bottom:26px;right:12px;z-index:9999;\"\n        \"background:rgba(255,255,255,0.92);color:#1a1a1a;font:12px system-ui;\"\n        \"padding:8px 10px;border:1px solid rgba(0,0,0,0.25);border-radius:4px'>\"\n        f\"<div style='font-weight:600;margin-bottom:4px'>{html.escape(spec.title)}</div>\"\n        f\"{rows}</div>\"))\n\n\n# ---------------------------------------------------------------- markers\n\n# Symbols are inline SVG in a DivIcon rather than Leaflet's image pins or\n# AwesomeMarkers: no extra CDN fetch, exact control of colour, and the shape\n# scales cleanly when the imagery is zoomed past its native tile level.\nMARKER_BOX = 18          # px; the symbol is centred on the coordinate\nMARKER_SHAPES = {\n    \"circle\": \"<circle cx='9' cy='9' r='6'/>\",\n    \"square\": \"<rect x='3.5' y='3.5' width='11' height='11' rx='1'/>\",\n    \"diamond\": \"<path d='M9 2.5 L15.5 9 L9 15.5 L2.5 9 Z'/>\",\n    \"triangle\": \"<path d='M9 2.5 L15.5 15 L2.5 15 Z'/>\",\n    \"cross\": \"<path d='M4 4 L14 14 M14 4 L4 14' fill='none' stroke-width='3.4'/>\",\n    \"pin\": \"<path d='M9 16.5 C9 16.5 3 10.6 3 7 A6 6 0 1 1 15 7 C15 10.6 9 16.5 9 16.5 Z'/>\",\n}\n\n\ndef _add_markers(m, markers):\n    \"\"\"User-placed reference points, in their own toggleable layer.\"\"\"\n    if not markers:\n        return\n    group = folium.FeatureGroup(name=\"Markers\", show=True)\n    for mk in markers:\n        # Ring first, so the symbol and its label draw over it. Dashed and\n        # barely filled: it marks a tolerance, and must not hide the track\n        # passing through it, which is the thing being judged.\n        if mk.wp_radius > 0:\n            folium.Circle(\n                [mk.lat, mk.lon], radius=mk.wp_radius,\n                color=mk.style.color, weight=1.5, opacity=0.9,\n                dash_array=\"5 5\", fill=True, fill_opacity=0.06,\n                tooltip=f\"{html.escape(mk.name)} &middot; \"\n                        f\"{mk.wp_radius:g} m radius\").add_to(group)\n\n        folium.Marker(\n            [mk.lat, mk.lon],\n            icon=folium.DivIcon(\n                icon_size=(MARKER_BOX, MARKER_BOX),\n                icon_anchor=(MARKER_BOX // 2, MARKER_BOX // 2),\n                # Leaflet's own .leaflet-div-icon paints a white box and a grey\n                # border behind whatever it holds, so the class is replaced\n                # rather than extended.\n                class_name=\"boat-marker\",\n                html=_marker_icon_html(mk)),\n            tooltip=(f\"{html.escape(mk.name)} &middot; {mk.type}<br>\"\n                     f\"{mk.lat:.6f}, {mk.lon:.6f}\"),\n        ).add_to(group)\n    group.add_to(m)\n\n\ndef _marker_icon_html(mk):\n    shape = MARKER_SHAPES.get(mk.style.shape, MARKER_SHAPES[\"circle\"])\n    # The white stroke is what keeps every colour legible against satellite\n    # imagery, which is dark in water and bright on a wake.\n    symbol = (f\"<svg width='{MARKER_BOX}' height='{MARKER_BOX}' \"\n              f\"viewBox='0 0 {MARKER_BOX} {MARKER_BOX}' \"\n              f\"fill='{mk.style.color}' stroke='#ffffff' stroke-width='1.6' \"\n              f\"stroke-linejoin='round'>{shape}</svg>\")\n\n    # The label hangs outside the icon box, so the wrapper must not clip it. The\n    # label also ignores the pointer: it can be wide, and swallowing clicks that\n    # far from the symbol would block the map under it. The symbol itself stays\n    # hoverable, which is what shows the tooltip.\n    return (\n        f\"<div style='position:relative;width:{MARKER_BOX}px;\"\n        f\"height:{MARKER_BOX}px;overflow:visible'>{symbol}\"\n        f\"<span style='position:absolute;left:{MARKER_BOX + 3}px;top:1px;\"\n        f\"white-space:nowrap;pointer-events:none;font:600 11px/1.35 system-ui;\"\n        f\"padding:0 5px;border-radius:3px;background:rgba(255,255,255,0.92);\"\n        f\"color:#1a1a1a;border:1px solid rgba(0,0,0,0.25)'>\"\n        f\"{html.escape(mk.name)}</span></div>\")\n\n\n# ---------------------------------------------------------------- layers\n\nTRACK_VERTEX_CAP = 12000\n\n\ndef _add_track(group, view, color_by, base, scale):\n    view = _decimate(view, TRACK_VERTEX_CAP)\n    coords = view[[\"lat\", \"lon\"]].to_numpy()\n    if len(coords) < 2:\n        return\n\n    codes, color_of, tips = _track_classes(view, color_by, scale)\n    if codes is None:\n        folium.PolyLine(coords.tolist(), color=base, weight=2.5, opacity=0.85,\n                        tooltip=\"track\").add_to(group)\n        return\n\n    start = 0\n    for i in range(1, len(codes) + 1):\n        if i == len(codes) or codes[i] != codes[start]:\n            # Runs share their boundary vertex, so consecutive stretches join up\n            # instead of leaving a one-segment hole between them -- and a run of\n            # a single sample, such as a brief RESET, still draws.\n            stop = min(i + 1, len(coords))\n            if codes[start] >= 0 and stop - start >= 2:\n                folium.PolyLine(coords[start:stop].tolist(),\n                                color=color_of(codes[start]), weight=2.5,\n                                opacity=0.9, tooltip=tips(codes[start])).add_to(group)\n            start = i\n\n\ndef _track_classes(view, color_by, scale):\n    \"\"\"Per-vertex class code, plus colour and tooltip for a code.\n\n    Returns (None, None, None) when the track should be drawn in one flat\n    colour. Continuous variables are quantised so the track becomes a handful of\n    polylines rather than one per segment; categorical ones use their own values.\n    \"\"\"\n    spec = CATEGORICALS.get(color_by)\n    if spec is not None:\n        values = spec.text(view)\n        index = {v: i for i, v in enumerate(dict.fromkeys(values))}\n        names = {i: v for v, i in index.items()}\n        codes = np.array([index[v] for v in values], dtype=int)\n        return (codes,\n                lambda c: spec.color(names[c]),\n                lambda c: f\"{spec.title.lower()} {names[c] or 'not recorded'}\")\n\n    if scale is None or color_by in (\"log\", \"none\"):\n        return None, None, None\n\n    vals = _values_for(view, color_by)\n    if vals is None:\n        return None, None, None\n\n    vals = np.asarray(vals, dtype=float)\n    finite = np.isfinite(vals)\n    if not finite.any():\n        return None, None, None\n\n    lo, hi = np.nanmin(vals[finite]), np.nanmax(vals[finite])\n    span = (hi - lo) or 1.0\n    # Non-finite entries are cast from a stand-in rather than from NaN, which\n    # has no defined integer value, then marked -1 so they are skipped.\n    codes = np.clip(((np.where(finite, vals, lo) - lo) / span * 11).astype(int), 0, 11)\n    codes[~finite] = -1\n    return codes, lambda c: scale(lo + (c + 0.5) / 12 * span), lambda c: color_by\n\n\n# Above this many points, per-marker popups dominate the generated HTML (each\n# costs roughly 2 KB), so detail collapses into the tooltip instead.\nPOPUP_LIMIT = 600\n\n\ndef _add_points(group, view, log_id, color_by, base, scale, budget):\n    view = _decimate(view, budget)\n    colors = _point_colors(view, color_by, base, scale)\n    rich = len(view) <= POPUP_LIMIT\n\n    for (_, r), c in zip(view.iterrows(), colors):\n        marker = folium.CircleMarker(\n            [r[\"lat\"], r[\"lon\"]], radius=2.5, color=c, weight=1,\n            fill=True, fill_color=c, fill_opacity=0.85,\n            tooltip=_tooltip(r))\n        if rich:\n            marker.add_child(folium.Popup(_popup_html(r, log_id), max_width=280))\n        marker.add_to(group)\n\n\ndef _fmt(v, unit=\"\", digits=1, dash=\"--\"):\n    if v is None or (isinstance(v, (float, np.floating)) and not np.isfinite(v)):\n        return dash\n    return f\"{v:.{digits}f}{unit}\"\n\n\ndef _cell(r, name):\n    \"\"\"A row's value as a string, empty for missing or NaN.\n\n    `or \"\"` alone will not do it: NaN is truthy, so a missing cell would render\n    as the literal text \"nan\".\n    \"\"\"\n    v = r.get(name)\n    return \"\" if v is None or pd.isna(v) else str(v)\n\n\ndef _mode_text(r):\n    \"\"\"Control mode, qualified by the AUTO sub-mode when there is one.\"\"\"\n    mode = _cell(r, \"mode\")\n    if not mode:\n        return \"\"\n    auto = _cell(r, \"auto_mode\")\n    return f\"{mode} \u00b7 {AUTO_MODE_LABELS.get(auto, auto)}\" if auto else mode\n\n\ndef _tooltip(r):\n    parts = [f\"row {int(r['row'])}\", pd.Timestamp(r[\"t\"]).strftime(\"%H:%M:%S\")]\n    mode = _mode_text(r)\n    if mode:\n        parts.append(mode)\n    state = _cell(r, \"sail_state\")\n    if state:\n        parts.append(state)\n    if np.isfinite(r.get(\"hdg\", np.nan)):\n        parts.append(f\"hdg {_fmt(r['hdg'], '\u00b0', 0)}\")\n    if np.isfinite(r.get(\"speed\", np.nan)):\n        parts.append(f\"{_fmt(r['speed'], ' m/s', 2)}\")\n    return \" \u00b7 \".join(parts)\n\n\ndef _finite(r, name):\n    return np.isfinite(r.get(name, np.nan))\n\n\ndef _popup_html(r, log_id):\n    def row(label, value):\n        shade = \" style='color:#898781'\" if value == \"--\" else \"\"\n        return f\"<tr><td>{label}</td><td{shade}><b>{value}</b></td></tr>\"\n\n    # The fixed rows are the ones every firmware revision can fill. The rest\n    # appear only where the log actually carries them, so a 2026-08 popup gains\n    # the autopilot's own state without an older log growing a column of dashes.\n    extra = \"\"\n    state = _cell(r, \"sail_state\")\n    propulsion = _cell(r, \"propulsion\")\n    if state or propulsion:\n        extra += row(\"sail\", html.escape(\" \u00b7 \".join(x for x in (state, propulsion) if x)))\n    if _finite(r, \"twd\") or _finite(r, \"tws\"):\n        extra += row(\"true wind\", f\"{_fmt(r.get('twd'), '&deg;', 0)} at \"\n                                  f\"{_fmt(r.get('tws'), ' m/s', 1)}\")\n    if _finite(r, \"twa\"):\n        extra += row(\"TWA\", _fmt(r.get(\"twa\"), \"&deg;\", 0))\n    if _finite(r, \"des_hdg\"):\n        extra += row(\"desired hdg\", _fmt(r.get(\"des_hdg\"), \"&deg;\", 0))\n    if _finite(r, \"xte\"):\n        extra += row(\"cross-track\", _fmt(r.get(\"xte\"), \" m\"))\n    if _finite(r, \"dist\"):\n        left = r.get(\"wp_left\")\n        suffix = f\" ({int(left)} left)\" if np.isfinite(left if left is not None else np.nan) else \"\"\n        extra += row(\"to waypoint\", _fmt(r.get(\"dist\"), \" m\") + suffix)\n    if _finite(r, \"rudder\") or _finite(r, \"sail\"):\n        extra += row(\"rudder / sail\", f\"{_fmt(r.get('rudder'), '&deg;', 0)} / \"\n                                      f\"{_fmt(r.get('sail'), '&deg;', 0)}\")\n    reason = _cell(r, \"sail_reason\")\n    if reason:\n        extra += (\"<tr><td colspan='2' style='padding-top:4px;color:#6b6a65'>\"\n                  f\"{html.escape(reason)}</td></tr>\")\n\n    return (\n        f\"<div style='font:12px system-ui'><b>{log_id}</b><br>\"\n        f\"<span style='color:#898781'>row {int(r['row'])} &middot; \"\n        f\"{pd.Timestamp(r['t']).strftime('%Y-%m-%d %H:%M:%S')} UTC</span>\"\n        f\"<table style='margin-top:6px;border-spacing:6px 2px'>\"\n        + row(\"lat, lon\", f\"{r['lat']:.6f}, {r['lon']:.6f}\")\n        + row(\"mode\", html.escape(_mode_text(r)) or \"--\")\n        + row(\"heading\", _fmt(r.get(\"hdg\"), \"&deg;\"))\n        + row(\"course\", _fmt(r.get(\"cog\"), \"&deg;\"))\n        + row(\"hdg - cog\", _fmt(r.get(\"resid\"), \"&deg;\"))\n        + row(\"AWA\", _fmt(r.get(\"awa\"), \"&deg;\"))\n        + row(\"speed\", _fmt(r.get(\"speed\"), \" m/s\", 2))\n        + extra\n        + \"</table></div>\")\n\n\ndef _add_arrows(group, view, kind, budget, length_m, convention, wind_sign):\n    \"\"\"Draw direction arrows, spaced by distance travelled rather than by index.\n\n    Index spacing would clump every arrow where the boat sat still, which is\n    most of these logs.\n    \"\"\"\n    angles = _arrow_angles(view, kind, convention, wind_sign)\n    if angles is None:\n        return\n\n    sel = _space_by_distance(view, angles, budget)\n    if sel.empty:\n        return\n\n    color = ARROW_COLORS.get(kind, \"#eb6834\")\n    lat, lon = sel[\"lat\"].to_numpy(), sel[\"lon\"].to_numpy()\n    th = sel[\"_angle\"].to_numpy()\n\n    tip_lat, tip_lon = offset_latlon(lat, lon, th, length_m)\n    bl_lat, bl_lon = offset_latlon(tip_lat, tip_lon, th + 150.0, length_m * 0.35)\n    br_lat, br_lon = offset_latlon(tip_lat, tip_lon, th - 150.0, length_m * 0.35)\n\n    label = ARROW_LABELS.get(kind, kind.replace(\"_\", \" \"))\n    for i in range(len(sel)):\n        folium.PolyLine([[lat[i], lon[i]], [tip_lat[i], tip_lon[i]]],\n                        color=color, weight=2.5, opacity=0.9,\n                        tooltip=f\"{label} {th[i]:.0f}&deg;\").add_to(group)\n        folium.PolyLine([[bl_lat[i], bl_lon[i]], [tip_lat[i], tip_lon[i]],\n                         [br_lat[i], br_lon[i]]],\n                        color=color, weight=2, opacity=0.9).add_to(group)\n\n\ndef _arrow_angles(view, kind, convention, wind_sign):\n    \"\"\"Angle each arrow should point, as a clockwise compass bearing.\"\"\"\n    acw = convention.startswith(\"ACW\")\n\n    if kind == \"heading\":\n        a = view[\"hdg\"].to_numpy(dtype=float)\n        return wrap360(360.0 - a) if acw else wrap360(a)\n    if kind == \"cog\":\n        return view[\"cog\"].to_numpy(dtype=float) if \"cog\" in view else None\n    if kind in (\"wind_from\", \"wind_to\"):\n        h = view[\"hdg\"].to_numpy(dtype=float)\n        if acw:\n            h = wrap360(360.0 - h)\n        w = wind_direction(h, view[\"awa\"].to_numpy(dtype=float), wind_sign)\n        return wrap360(w + 180.0) if kind == \"wind_to\" else w\n    if kind == \"twd\":\n        # Already a compass direction the boat computed for itself, so it takes\n        # neither the heading convention nor the AWA sign guess -- that is what\n        # makes it worth drawing next to the derived apparent-wind arrow.\n        return view[\"twd\"].to_numpy(dtype=float) if \"twd\" in view else None\n    if kind == \"des_hdg\":\n        return view[\"des_hdg\"].to_numpy(dtype=float) if \"des_hdg\" in view else None\n    return None\n\n\ndef _space_by_distance(view, angles, budget):\n    v = view.copy()\n    v[\"_angle\"] = angles\n    v = v[np.isfinite(v[\"_angle\"])]\n    if v.empty or budget <= 0:\n        return v.iloc[0:0]\n    if len(v) <= budget:\n        return v\n\n    lat, lon = v[\"lat\"].to_numpy(), v[\"lon\"].to_numpy()\n    m_lat = 111132.0\n    m_lon = 111320.0 * np.cos(np.radians(lat.mean()))\n    step = np.hypot(np.diff(lat) * m_lat, np.diff(lon) * m_lon)\n    cumulative = np.concatenate([[0.0], np.cumsum(step)])\n\n    total = cumulative[-1]\n    if total <= 0:\n        return v.iloc[:: max(1, len(v) // budget)]\n    targets = np.linspace(0, total, budget)\n    idx = np.unique(np.searchsorted(cumulative, targets))\n    return v.iloc[np.clip(idx, 0, len(v) - 1)]\n\n\ndef _decimate(view, budget):\n    if budget <= 0 or len(view) <= budget:\n        return view\n    return view.iloc[np.linspace(0, len(view) - 1, budget).astype(int)]\n\n\ndef _add_cursor(m, cursor, convention, wind_sign):\n    \"\"\"Boat marker at the current time, with heading and wind indicators.\"\"\"\n    lat, lon = cursor[\"lat\"], cursor[\"lon\"]\n    folium.CircleMarker([lat, lon], radius=7, color=\"#ffffff\", weight=2,\n                        fill=True, fill_color=\"#d03b3b\", fill_opacity=1.0,\n                        tooltip=\"current position\").add_to(m)\n\n    hdg = cursor.get(\"hdg\")\n    if hdg is not None and np.isfinite(hdg):\n        th = 360.0 - hdg if convention.startswith(\"ACW\") else hdg\n        tip = offset_latlon(lat, lon, th, 12.0)\n        folium.PolyLine([[lat, lon], [float(tip[0]), float(tip[1])]],\n                        color=\"#d03b3b\", weight=3.5, opacity=1.0,\n                        tooltip=f\"heading {hdg:.0f}&deg;\").add_to(m)\n\n        awa = cursor.get(\"awa\")\n        if awa is not None and np.isfinite(awa):\n            wf = float(wind_direction(th, awa, wind_sign))\n            tip = offset_latlon(lat, lon, wf, 10.0)\n            folium.PolyLine([[lat, lon], [float(tip[0]), float(tip[1])]],\n                            color=\"#9457c9\", weight=3, opacity=0.95, dash_array=\"4\",\n                            tooltip=f\"wind from {wf:.0f}&deg;\").add_to(m)\n"}, "boatviz\\markers.py": {"data": "\"\"\"Named reference points the user places on the map by hand.\n\nA track passing 4 m from a buoy and one passing 40 m from it look identical\nwithout something to measure against, so the app lets you type the buoy in.\n\nNothing here imports Streamlit: the app owns the sheet widget, this module owns\nwhat comes out of it -- validation, the CSV round-trip, and how near the boat\nactually got.\n\"\"\"\n\nimport io\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\n\nfrom .geo import haversine_m\n\n\n@dataclass(frozen=True)\nclass MarkerType:\n    label: str\n    shape: str\n    color: str\n\n\n# Colours are drawn from the palette the map already uses, so a marker never\n# reads as a different visual system from the tracks under it. Shape carries the\n# same distinction independently, which keeps the types apart for anyone who\n# cannot separate the hues.\nMARKER_TYPES = {t.label: t for t in (\n    MarkerType(\"Waypoint\", \"diamond\", \"#2a78d6\"),\n    MarkerType(\"Buoy\", \"circle\", \"#eb6834\"),\n    MarkerType(\"Hazard\", \"cross\", \"#d03b3b\"),\n    MarkerType(\"Start\", \"triangle\", \"#1baf7a\"),\n    MarkerType(\"Finish\", \"square\", \"#9457c9\"),\n    MarkerType(\"Note\", \"pin\", \"#6b7280\"),\n)}\n\nDEFAULT_TYPE = \"Waypoint\"\n\n# Matches point_to_point_tolerance_m in every boat_config_*.json, so the ring\n# drawn here is the same circle the autopilot retires a waypoint inside. Station\n# keeping uses 25 m, which is why this is per-marker rather than one setting.\nDEFAULT_RADIUS_M = 10.0\n\n# Types are matched case-insensitively and stored canonically: a file written by\n# hand or by another tool says \"buoy\", and silently demoting that to a waypoint\n# would lose information the user did supply.\nTYPE_LOOKUP = {label.lower(): label for label in MARKER_TYPES}\n\nCOLUMNS = [\"name\", \"lat\", \"lon\", \"type\", \"wp_radius\"]\n\n# Spreadsheets and chartplotters disagree about what the coordinate columns are\n# called, and the file is meant to be editable outside this app.\nCOLUMN_ALIASES = {\n    \"name\": (\"name\", \"label\", \"id\"),\n    \"lat\": (\"lat\", \"latitude\"),\n    \"lon\": (\"lon\", \"longitude\", \"lng\", \"long\"),\n    \"type\": (\"type\", \"kind\", \"symbol\"),\n    \"wp_radius\": (\"wp_radius\", \"radius\", \"wp_radius_m\", \"radius_m\", \"tolerance_m\"),\n}\n\n\n@dataclass(frozen=True)\nclass Marker:\n    name: str\n    lat: float\n    lon: float\n    type: str = DEFAULT_TYPE\n    wp_radius: float = DEFAULT_RADIUS_M\n\n    @property\n    def style(self) -> MarkerType:\n        return MARKER_TYPES.get(self.type, MARKER_TYPES[DEFAULT_TYPE])\n\n\ndef empty_frame() -> pd.DataFrame:\n    \"\"\"Correctly typed empty sheet. Dtypes matter: they decide what the editor\n    offers in each cell, and an all-object frame gives text boxes for latitude.\"\"\"\n    return pd.DataFrame({\"name\": pd.Series(dtype=\"object\"),\n                         \"lat\": pd.Series(dtype=\"float64\"),\n                         \"lon\": pd.Series(dtype=\"float64\"),\n                         \"type\": pd.Series(dtype=\"object\"),\n                         \"wp_radius\": pd.Series(dtype=\"float64\")})\n\n\ndef valid_rows(frame):\n    \"\"\"(markers, complaints) from a sheet.\n\n    Wholly blank rows are ignored rather than reported: the editor keeps one for\n    typing into, and a row is incomplete for a few keystrokes on the way to being\n    finished. Only a row carrying something but not enough is worth a complaint.\n    \"\"\"\n    markers, problems = [], []\n    if frame is None or not len(frame):\n        return markers, problems\n\n    for n, (_, r) in enumerate(frame.iterrows(), start=1):\n        name = _text(r.get(\"name\"))\n        lat, lon = _number(r.get(\"lat\")), _number(r.get(\"lon\"))\n\n        if not name and lat is None and lon is None:\n            continue\n        if not name:\n            problems.append(f\"Row {n} has coordinates but no name.\")\n            continue\n        if lat is None or lon is None:\n            problems.append(f\"Row {n} (**{name}**) needs both a latitude and a \"\n                            f\"longitude.\")\n            continue\n        if not -90 <= lat <= 90 or not -180 <= lon <= 180:\n            problems.append(f\"Row {n} (**{name}**): {lat}, {lon} is not a \"\n                            f\"position on Earth.\")\n            continue\n\n        # A blank radius means \"the usual one\", not \"no ring\" -- zero is how you\n        # ask for no ring, and a negative number is a mistake worth naming.\n        radius = _number(r.get(\"wp_radius\"))\n        if radius is None:\n            radius = DEFAULT_RADIUS_M\n        elif radius < 0:\n            problems.append(f\"Row {n} (**{name}**): a radius cannot be \"\n                            f\"negative. Using {DEFAULT_RADIUS_M:g} m.\")\n            radius = DEFAULT_RADIUS_M\n\n        markers.append(Marker(name, lat, lon, _type(r.get(\"type\")), radius))\n    return markers, problems\n\n\ndef parse_csv(data) -> tuple[pd.DataFrame, list[str]]:\n    \"\"\"Read a markers file back into a sheet. Returns (frame, problems).\n\n    Rows with unusable coordinates are kept, not dropped -- they come back as\n    empty cells so they can be fixed in place, and valid_rows says what is wrong\n    with each. Only structural trouble is reported here.\n    \"\"\"\n    try:\n        source = io.BytesIO(data) if isinstance(data, (bytes, bytearray)) else data\n        raw = pd.read_csv(source)\n    except Exception as exc:                                       # noqa: BLE001\n        return empty_frame(), [f\"Could not read that file: {exc}\"]\n\n    lower = {str(c).strip().lower(): c for c in raw.columns}\n    found = {role: next((lower[a] for a in aliases if a in lower), None)\n             for role, aliases in COLUMN_ALIASES.items()}\n\n    missing = [role for role in (\"name\", \"lat\", \"lon\") if found[role] is None]\n    if missing:\n        return empty_frame(), [\n            f\"That file has no {', '.join(missing)} column. Expected columns \"\n            f\"{', '.join(COLUMNS)} in any order.\"]\n\n    frame = empty_frame()\n    frame[\"name\"] = raw[found[\"name\"]].astype(object)\n    frame[\"lat\"] = pd.to_numeric(raw[found[\"lat\"]], errors=\"coerce\")\n    frame[\"lon\"] = pd.to_numeric(raw[found[\"lon\"]], errors=\"coerce\")\n    frame[\"wp_radius\"] = (\n        pd.to_numeric(raw[found[\"wp_radius\"]], errors=\"coerce\")\n        .fillna(DEFAULT_RADIUS_M) if found[\"wp_radius\"] is not None\n        else DEFAULT_RADIUS_M)\n\n    problems = []\n    if found[\"type\"] is None:\n        frame[\"type\"] = DEFAULT_TYPE\n    else:\n        given = raw[found[\"type\"]].map(_text)\n        frame[\"type\"] = given.map(_type)\n        unknown = sorted({g for g in given if g and g.lower() not in TYPE_LOOKUP})\n        if unknown:\n            problems.append(\n                f\"Unrecognised type(s) {', '.join(unknown)} were set to \"\n                f\"{DEFAULT_TYPE}. Known types: {', '.join(MARKER_TYPES)}.\")\n\n    return frame.reset_index(drop=True), problems\n\n\ndef to_csv(markers) -> bytes:\n    frame = pd.DataFrame([(m.name, m.lat, m.lon, m.type, m.wp_radius)\n                          for m in markers], columns=COLUMNS)\n    return frame.to_csv(index=False).encode()\n\n\ndef closest_approach(markers, logs) -> pd.DataFrame:\n    \"\"\"How near the boat got to each marker, and when.\n\n    Measured against `view`, the fixes inside the selected time window, so the\n    answer follows the time range rather than the whole recording.\n    \"\"\"\n    rows = []\n    for mk in markers:\n        best = None\n        for lg in logs:\n            view = getattr(lg, \"view\", None)\n            if view is None or not len(view):\n                continue\n            d = haversine_m(mk.lat, mk.lon,\n                            view[\"lat\"].to_numpy(), view[\"lon\"].to_numpy())\n            i = int(np.argmin(d))\n            if best is None or d[i] < best[0]:\n                best = (float(d[i]), view[\"t\"].iloc[i], lg.id)\n\n        rows.append({\n            \"Marker\": mk.name,\n            \"Type\": mk.type,\n            \"Closest approach (m)\": best[0] if best else np.nan,\n            \"Radius (m)\": mk.wp_radius,\n            # The ring is an arrival test, so the table says whether it passed.\n            \"Inside radius\": (\"\u2013\" if not best or mk.wp_radius <= 0\n                              else \"yes\" if best[0] <= mk.wp_radius else \"no\"),\n            \"When (UTC)\": pd.Timestamp(best[1]).strftime(\"%b %d %H:%M:%S\") if best else \"\u2013\",\n            \"Log\": best[2].replace(\"boat_log_\", \"\") if best else \"\u2013\",\n        })\n    return pd.DataFrame(rows)\n\n\ndef _text(v) -> str:\n    return \"\" if v is None or pd.isna(v) else str(v).strip()\n\n\ndef _number(v):\n    if v is None or pd.isna(v):\n        return None\n    try:\n        f = float(v)\n    except (TypeError, ValueError):\n        return None\n    return f if np.isfinite(f) else None\n\n\ndef _type(v) -> str:\n    return TYPE_LOOKUP.get(_text(v).lower(), DEFAULT_TYPE)\n"}, "boatviz\\qa.py": {"data": "\"\"\"Per-channel health assessment.\n\nThe 2026 logs are mostly a stationary boat with dead sensors, so \"is this channel\nactually alive?\" has to be answered before anything is plotted. Distinct-value\ncounts cannot answer it: in boat_log_20260804_061853.csv the heading channel has\n77370 distinct values across 77371 rows, and a peak-to-peak of 0.311 degrees.\nThe complementary filter dithers in the 4th decimal forever. Spread is the only\nreliable signal.\n\"\"\"\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\n\nfrom .geo import circ_spread_deg\nfrom .schema import CHANNELS\n\nALIVE, PARTIAL, FROZEN, CONSTANT, ABSENT = \"ALIVE\", \"PARTIAL\", \"FROZEN\", \"CONSTANT\", \"ABSENT\"\n\nWINDOW = \"60s\"\nPRESENT_MIN = 0.02      # below this fraction of non-null samples the channel is absent\nALIVE_FRAC = 0.10       # fraction of live windows needed for an overall ALIVE verdict\nPARTIAL_FRAC = 0.01\nSTATIONARY_FRAC = 0.02  # fraction of fixes above the speed gate to count as moving\n\n\n@dataclass\nclass ChannelReport:\n    key: str\n    label: str\n    unit: str\n    verdict: str\n    spread: float = 0.0\n    vmin: float = np.nan\n    vmax: float = np.nan\n    const_value: float = np.nan\n    present_frac: float = 0.0\n    alive_frac: float = 0.0\n    alive_windows: list = field(default_factory=list)   # [(start, end)] merged live spans\n\n    circular: bool = False\n    freeze_checked: bool = True\n\n    @property\n    def summary(self) -> str:\n        if self.verdict == ABSENT:\n            return \"no data\"\n        if self.verdict == CONSTANT:\n            return f\"constant @ {self.const_value:g}{self.unit}\"\n        if not self.freeze_checked:\n            # A commanded or computed value; \"live x% of the log\" would be\n            # measuring the autopilot's activity, not a sensor's health.\n            return f\"logged {self.present_frac * 100:.0f}%, range {self.vmin:.3g}\u2013{self.vmax:.3g}{self.unit}\"\n        if self.verdict == FROZEN:\n            # For a circular channel the min/max range is misleading (a value\n            # wobbling across 0 spans 0-360), so report the spread instead.\n            span = self.spread if self.circular else self.vmax - self.vmin\n            return f\"frozen, spread {span:.3f}{self.unit}\"\n        live = f\"live {self.alive_frac * 100:.0f}% of the log\"\n        if self.circular:\n            return f\"{live}, spread {self.spread:.0f}{self.unit}\"\n        return f\"{live}, range {self.vmin:.3g}\u2013{self.vmax:.3g}{self.unit}\"\n\n\n@dataclass\nclass QaReport:\n    channels: dict = field(default_factory=dict)\n    gps_verdict: str = \"NO GPS\"\n    moving_frac: float = 0.0\n    n_outliers: int = 0\n    dup_frac: float = 0.0\n    monotonic_breaks: int = 0\n\n    def channel(self, key) -> ChannelReport | None:\n        return self.channels.get(key)\n\n    def is_alive(self, key) -> bool:\n        c = self.channels.get(key)\n        return c is not None and c.verdict == ALIVE\n\n\ndef assess_channel(df: pd.DataFrame, ch) -> ChannelReport:\n    s = df[ch.key]\n    present = float(s.notna().mean()) if len(s) else 0.0\n    rep = ChannelReport(ch.key, ch.label, ch.unit, ABSENT,\n                        present_frac=present, circular=ch.circular,\n                        freeze_checked=ch.freeze_check)\n\n    if present < PRESENT_MIN:\n        return rep\n\n    vals = s.dropna()\n    rep.vmin, rep.vmax = float(vals.min()), float(vals.max())\n\n    if vals.nunique() == 1:\n        rep.verdict = CONSTANT\n        rep.const_value = float(vals.iloc[0])\n        return rep\n\n    if not ch.freeze_check:\n        # It is varying and it is present; there is nothing further to ask of a\n        # value the boat computed itself. Skipping the resample below also keeps\n        # the per-window Python loop off two thirds of the channel list.\n        rep.verdict = ALIVE\n        return rep\n\n    spread_fn = circ_spread_deg if ch.circular else _linear_spread\n    rep.spread = spread_fn(vals.to_numpy())\n\n    windows = df[[\"t\", ch.key]].dropna().set_index(\"t\")[ch.key].resample(WINDOW)\n    per_window = windows.apply(lambda w: spread_fn(w.to_numpy()) if len(w) >= 3 else np.nan)\n    per_window = per_window.dropna()\n\n    if per_window.empty:\n        rep.verdict = FROZEN if rep.spread < ch.freeze_tau else ALIVE\n        return rep\n\n    live = per_window >= ch.freeze_tau\n    rep.alive_frac = float(live.mean())\n    rep.alive_windows = _merge_spans(per_window.index[live], pd.Timedelta(WINDOW))\n\n    if rep.alive_frac >= ALIVE_FRAC:\n        rep.verdict = ALIVE\n    elif rep.alive_frac >= PARTIAL_FRAC:\n        rep.verdict = PARTIAL\n    else:\n        rep.verdict = FROZEN\n    return rep\n\n\ndef _linear_spread(a) -> float:\n    a = np.asarray(a, dtype=float)\n    a = a[np.isfinite(a)]\n    if a.size < 2:\n        return 0.0\n    return float(np.percentile(a, 95) - np.percentile(a, 5))\n\n\ndef
