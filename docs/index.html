]\n\n\ndef _decimate(view, budget):\n    if budget <= 0 or len(view) <= budget:\n        return view\n    return view.iloc[np.linspace(0, len(view) - 1, budget).astype(int)]\n\n\ndef _add_cursor(m, cursor, convention, wind_sign):\n    \"\"\"Boat marker at the current time, with heading and wind indicators.\"\"\"\n    lat, lon = cursor[\"lat\"], cursor[\"lon\"]\n    folium.CircleMarker([lat, lon], radius=7, color=\"#ffffff\", weight=2,\n                        fill=True, fill_color=\"#d03b3b\", fill_opacity=1.0,\n                        tooltip=\"current position\").add_to(m)\n\n    hdg = cursor.get(\"hdg\")\n    if hdg is not None and np.isfinite(hdg):\n        th = 360.0 - hdg if convention.startswith(\"ACW\") else hdg\n        tip = offset_latlon(lat, lon, th, 12.0)\n        folium.PolyLine([[lat, lon], [float(tip[0]), float(tip[1])]],\n                        color=\"#d03b3b\", weight=3.5, opacity=1.0,\n                        tooltip=f\"heading {hdg:.0f}&deg;\").add_to(m)\n\n        awa = cursor.get(\"awa\")\n        if awa is not None and np.isfinite(awa):\n            wf = float(wind_direction(th, awa, wind_sign))\n            tip = offset_latlon(lat, lon, wf, 10.0)\n            folium.PolyLine([[lat, lon], [float(tip[0]), float(tip[1])]],\n                            color=\"#9457c9\", weight=3, opacity=0.95, dash_array=\"4\",\n                            tooltip=f\"wind from {wf:.0f}&deg;\").add_to(m)\n"}, "boatviz/qa.py": {"data": "\"\"\"Per-channel health assessment.\n\nThe 2026 logs are mostly a stationary boat with dead sensors, so \"is this channel\nactually alive?\" has to be answered before anything is plotted. Distinct-value\ncounts cannot answer it: in boat_log_20260804_061853.csv the heading channel has\n77370 distinct values across 77371 rows, and a peak-to-peak of 0.311 degrees.\nThe complementary filter dithers in the 4th decimal forever. Spread is the only\nreliable signal.\n\"\"\"\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\n\nfrom .geo import circ_spread_deg\nfrom .schema import CHANNELS\n\nALIVE, PARTIAL, FROZEN, CONSTANT, ABSENT = \"ALIVE\", \"PARTIAL\", \"FROZEN\", \"CONSTANT\", \"ABSENT\"\n\nWINDOW = \"60s\"\nPRESENT_MIN = 0.02      # below this fraction of non-null samples the channel is absent\nALIVE_FRAC = 0.10       # fraction of live windows needed for an overall ALIVE verdict\nPARTIAL_FRAC = 0.01\nSTATIONARY_FRAC = 0.02  # fraction of fixes above the speed gate to count as moving\n\n\n@dataclass\nclass ChannelReport:\n    key: str\n    label: str\n    unit: str\n    verdict: str\n    spread: float = 0.0\n    vmin: float = np.nan\n    vmax: float = np.nan\n    const_value: float = np.nan\n    present_frac: float = 0.0\n    alive_frac: float = 0.0\n    alive_windows: list = field(default_factory=list)   # [(start, end)] merged live spans\n\n    circular: bool = False\n\n    @property\n    def summary(self) -> str:\n        if self.verdict == ABSENT:\n            return \"no data\"\n        if self.verdict == CONSTANT:\n            return f\"constant @ {self.const_value:g}{self.unit}\"\n        if self.verdict == FROZEN:\n            # For a circular channel the min/max range is misleading (a value\n            # wobbling across 0 spans 0-360), so report the spread instead.\n            span = self.spread if self.circular else self.vmax - self.vmin\n            return f\"frozen, spread {span:.3f}{self.unit}\"\n        live = f\"live {self.alive_frac * 100:.0f}% of the log\"\n        if self.circular:\n            return f\"{live}, spread {self.spread:.0f}{self.unit}\"\n        return f\"{live}, range {self.vmin:.3g}\u2013{self.vmax:.3g}{self.unit}\"\n\n\n@dataclass\nclass QaReport:\n    channels: dict = field(default_factory=dict)\n    gps_verdict: str = \"NO GPS\"\n    moving_frac: float = 0.0\n    n_outliers: int = 0\n    dup_frac: float = 0.0\n    monotonic_breaks: int = 0\n\n    def channel(self, key) -> ChannelReport | None:\n        return self.channels.get(key)\n\n    def is_alive(self, key) -> bool:\n        c = self.channels.get(key)\n        return c is not None and c.verdict == ALIVE\n\n\ndef assess_channel(df: pd.DataFrame, ch) -> ChannelReport:\n    s = df[ch.key]\n    present = float(s.notna().mean()) if len(s) else 0.0\n    rep = ChannelReport(ch.key, ch.label, ch.unit, ABSENT,\n                        present_frac=present, circular=ch.circular)\n\n    if present < PRESENT_MIN:\n        return rep\n\n    vals = s.dropna()\n    rep.vmin, rep.vmax = float(vals.min()), float(vals.max())\n\n    if vals.nunique() == 1:\n        rep.verdict = CONSTANT\n        rep.const_value = float(vals.iloc[0])\n        return rep\n\n    spread_fn = circ_spread_deg if ch.circular else _linear_spread\n    rep.spread = spread_fn(vals.to_numpy())\n\n    windows = df[[\"t\", ch.key]].dropna().set_index(\"t\")[ch.key].resample(WINDOW)\n    per_window = windows.apply(lambda w: spread_fn(w.to_numpy()) if len(w) >= 3 else np.nan)\n    per_window = per_window.dropna()\n\n    if per_window.empty:\n        rep.verdict = FROZEN if rep.spread < ch.freeze_tau else ALIVE\n        return rep\n\n    live = per_window >= ch.freeze_tau\n    rep.alive_frac = float(live.mean())\n    rep.alive_windows = _merge_spans(per_window.index[live], pd.Timedelta(WINDOW))\n\n    if rep.alive_frac >= ALIVE_FRAC:\n        rep.verdict = ALIVE\n    elif rep.alive_frac >= PARTIAL_FRAC:\n        rep.verdict = PARTIAL\n    else:\n        rep.verdict = FROZEN\n    return rep\n\n\ndef _linear_spread(a) -> float:\n    a = np.asarray(a, dtype=float)\n    a = a[np.isfinite(a)]\n    if a.size < 2:\n        return 0.0\n    return float(np.percentile(a, 95) - np.percentile(a, 5))\n\n\ndef _merge_spans(starts, width):\n    spans = []\n    for s in starts:\n        if spans and s - spans[-1][1] <= width:\n            spans[-1][1] = s + width\n        else:\n            spans.append([s, s + width])\n    return [tuple(s) for s in spans]\n\n\ndef assess(log) -> QaReport:\n    rep = QaReport()\n    if log.df.empty:\n        return rep\n\n    for ch in CHANNELS:\n        rep.channels[ch.key] = assess_channel(log.df, ch)\n\n    rep.monotonic_breaks = getattr(log, \"monotonic_breaks\", 0)\n    n_gps = getattr(log, \"n_gps_rows\", 0)\n    if n_gps:\n        rep.dup_frac = 1.0 - len(log.fix) / n_gps\n\n    if \"speed\" in log.fix.columns and len(log.fix):\n        spd = log.fix[\"speed\"].to_numpy()\n        ok = np.isfinite(spd)\n        if ok.any():\n            rep.moving_frac = float((spd[ok] > 0.5).mean())\n            rep.gps_verdict = \"MOVING\" if rep.moving_frac >= STATIONARY_FRAC else \"STATIONARY\"\n        rep.n_outliers = int(log.fix.get(\"outlier\", pd.Series(dtype=bool)).sum())\n    elif len(log.fix) >= 2:\n        rep.gps_verdict = \"UNKNOWN\"\n\n    return rep\n"}, "boatviz/schema.py": {"data": "\"\"\"Channel metadata and column detection for boat CSV logs.\n\nThe canonical schema written by boatv1/utils/data_logger.py is:\n\n    ts_iso, gps_lat, gps_lon, gps_ts, awa_deg, heading, rotation_vector,\n    geomag_rotation_vector, gyro_z_dps, heading_source, sys_temp_c, sys_volts_v\n\"\"\"\n\nfrom dataclasses import dataclass\n\nCANONICAL_COLUMNS = [\n    \"ts_iso\", \"gps_lat\", \"gps_lon\", \"gps_ts\", \"awa_deg\", \"heading\",\n    \"rotation_vector\", \"geomag_rotation_vector\", \"gyro_z_dps\",\n    \"heading_source\", \"sys_temp_c\", \"sys_volts_v\",\n]\n\n\n@dataclass(frozen=True)\nclass Channel:\n    key: str\n    label: str\n    unit: str\n    circular: bool\n    freeze_tau: float   # spread below this over a window means the channel is frozen\n    group: str\n    note: str = \"\"\n\n\n# freeze_tau values are calibrated against measured spreads in the known-frozen\n# logs: heading p2p 0.311 deg, geomag_rotation_vector p2p 0.620 deg, and\n# rotation_vector / awa_deg / gyro_z_dps fully constant.\nCHANNELS = [\n    Channel(\"heading\", \"Heading (filtered)\", \"\u00b0\", True, 1.0, \"navigation\",\n            \"Magnetic, clockwise from North. No declination applied.\"),\n    Channel(\"geomag_rotation_vector\", \"Heading (geomag, raw)\", \"\u00b0\", True, 1.0, \"navigation\",\n            \"Raw per-sample yaw, not a quaternion despite the name.\"),\n    Channel(\"rotation_vector\", \"Heading (rotation vector, raw)\", \"\u00b0\", True, 1.0, \"navigation\",\n            \"Raw per-sample yaw. Frozen in most 2026 logs.\"),\n    Channel(\"awa_deg\", \"Apparent wind angle\", \"\u00b0\", True, 0.5, \"wind\",\n            \"0 = head-to-wind, increases to starboard. Includes a +15\u00b0 vane mount offset.\"),\n    Channel(\"gyro_z_dps\", \"Yaw rate\", \"\u00b0/s\", False, 0.05, \"navigation\",\n            \"Sign unverified \u2014 the firmware contradicts itself. 96% exact zeros in 2026 logs.\"),\n    Channel(\"sys_temp_c\", \"Pi CPU temperature\", \"\u00b0C\", False, 0.2, \"system\",\n            \"Raspberry Pi CPU die temperature \u2014 not water or air temperature.\"),\n    Channel(\"sys_volts_v\", \"Pi core voltage\", \"V\", False, 0.005, \"system\",\n            \"Raspberry Pi core voltage from vcgencmd \u2014 not battery voltage.\"),\n]\n\nCHANNELS_BY_KEY = {c.key: c for c in CHANNELS}\nHEADING_KEYS = [\"heading\", \"geomag_rotation_vector\", \"rotation_vector\"]\n\n\ndef detect_columns(columns) -> dict:\n    \"\"\"Map canonical roles onto the actual column names present in a file.\n\n    Falls back to fuzzy matching so logs from other firmware revisions still load.\n    \"\"\"\n    lower = {str(c).strip().lower(): c for c in columns}\n    found = {}\n\n    for name in CANONICAL_COLUMNS:\n        if name in lower:\n            found[name] = lower[name]\n\n    if \"gps_lat\" not in found:\n        for lc, orig in lower.items():\n            if \"lat\" in lc:\n                found[\"gps_lat\"] = orig\n                break\n    if \"gps_lon\" not in found:\n        for lc, orig in lower.items():\n            if \"lon\" in lc or \"lng\" in lc:\n                found[\"gps_lon\"] = orig\n                break\n    if \"ts_iso\" not in found:\n        for lc, orig in lower.items():\n            if \"time\" in lc or lc.startswith(\"ts\"):\n                found[\"ts_iso\"] = orig\n                break\n\n    return found\n"}, "sample_logs/boat_log_20260803_145351_sample.csv": {"url": "./sample_logs/boat_log_20260803_145351_sample.csv"}, "sample_logs/boat_log_20260804_084601_sample.csv": {"url": "./sample_logs/boat_log_20260804_084601_sample.csv"}},
  streamlitConfig: { "client.toolbarMode": "minimal" },
}, document.getElementById("root"));

// The boot card sits above the app until Streamlit paints something.
const boot = document.getElementById("boot");
const root = document.getElementById("root");
new MutationObserver((_m, obs) => {
  if (root.querySelector('[data-testid="stAppViewContainer"]')) {
    boot.style.transition = "opacity .4s"; boot.style.opacity = "0";
    setTimeout(() => boot.remove(), 400); obs.disconnect();
  }
}).observe(root, { childList: true, subtree: true });
</script>
